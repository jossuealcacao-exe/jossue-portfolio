name: Scheduled blog publish

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
  push:
    branches: [master]
    paths:
      - 'src/content/blog/**'
      - 'src/assets/blog/**'
      - 'blog/**'

concurrency:
  group: blog-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run blog:validate
      - run: npm run check --prefix blog
      - run: PUBLIC_SITE_URL=https://blog.jossuealcala.com npm run build --prefix blog
      - name: Deploy due content
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npm run deploy --prefix blog
      - name: Explain inactive deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo 'Validation passed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to activate scheduled deployment.'
