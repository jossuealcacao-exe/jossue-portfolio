<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jossue AI · Panel</title>
<style>
/* Mismo lenguaje que el visor de Daniela: sistema macOS (Messages), un acento, semántica solo en estados. */
:root{
  color-scheme:light;
  --sidebar:#F2F1F0; --content:#FFFFFF; --card:#FFFFFF; --page:#F5F5F7;
  --label:rgba(0,0,0,.86); --label-2:rgba(0,0,0,.52); --label-3:rgba(0,0,0,.30); --label-4:rgba(0,0,0,.14);
  --sep:rgba(0,0,0,.09); --control:rgba(0,0,0,.05); --control-hover:rgba(0,0,0,.08);
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12);
  --bubble-in:#E9E9EB; --bubble-out:#0B84FF;
  --good:#248A3D; --good-bg:rgba(52,199,89,.14); --warn:#B25000; --warn-bg:rgba(255,149,0,.16); --bad:#D70015; --bad-bg:rgba(255,59,48,.13);
  --shadow-card:0 0 0 1px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04); --grid:#ECECEE; --muted:#8E8E93; --s2:#FF9500;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --sidebar:#262628; --content:#1E1E1E; --card:#2A2A2C; --page:#1A1A1A;
  --label:rgba(255,255,255,.88); --label-2:rgba(255,255,255,.55); --label-3:rgba(255,255,255,.30); --label-4:rgba(255,255,255,.14);
  --sep:rgba(255,255,255,.10); --control:rgba(255,255,255,.08); --control-hover:rgba(255,255,255,.12);
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.22); --bubble-in:#3B3B3D; --bubble-out:#0A84FF;
  --good:#30D158; --good-bg:rgba(48,209,88,.18); --warn:#FF9F0A; --warn-bg:rgba(255,159,10,.18); --bad:#FF453A; --bad-bg:rgba(255,69,58,.18);
  --shadow-card:0 0 0 1px rgba(255,255,255,.07); --grid:#333336; --muted:#8E8E93;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--label);background:var(--page);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:330px 1fr;grid-template-rows:52px 1fr;height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--sep);background:var(--sidebar)}
header h1{margin:0 8px 0 4px;font-size:14px;font-weight:600;white-space:nowrap}
.seg{display:inline-flex;background:var(--control);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:6px;cursor:pointer;color:var(--label-2)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--label);box-shadow:var(--shadow-card)}
.sp{flex:1}
.tb{border:0;background:transparent;width:30px;height:28px;border-radius:7px;cursor:pointer;color:var(--label-2);display:inline-grid;place-items:center}
.tb:hover{background:var(--control-hover)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--label-2);font-size:12px;white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.live.err i{background:var(--bad)} .live.busy i{background:var(--warn)}
aside{border-right:1px solid var(--sep);background:var(--sidebar);display:flex;flex-direction:column;min-height:0}
.search{padding:10px 12px 6px}
.search input{width:100%;border:0;border-radius:8px;padding:6px 10px;background:var(--control);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:4px 12px 8px}
.chip{border:1px solid var(--sep);background:transparent;border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--label-2)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.dates{display:flex;gap:6px;padding:0 12px 8px;align-items:center;color:var(--label-2);font-size:12px}
.dates input{border:0;background:var(--control);border-radius:6px;padding:3px 6px;font-size:12px}
.count{padding:2px 14px 6px;color:var(--label-3);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.list{overflow:auto;flex:1;padding:0 6px 10px}
.row{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer}
.row:hover{background:var(--control)}
.row[aria-current=true]{background:var(--accent);color:#fff}
.row[aria-current=true] .meta,.row[aria-current=true] .op{color:rgba(255,255,255,.85)}
.row .top{display:flex;gap:6px;align-items:baseline}
.row b{font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{color:var(--label-3);font-size:11px;white-space:nowrap}
.row .op{color:var(--label-2);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--control);color:var(--label-2)}
.tag.lead{background:var(--good-bg);color:var(--good)} .tag.audit{background:var(--accent-soft);color:var(--accent)} .tag.abuse{background:var(--bad-bg);color:var(--bad)} .tag.wa{background:var(--warn-bg);color:var(--warn)}
main{overflow:auto;background:var(--content);min-height:0}
.thread{max-width:760px;margin:0 auto;padding:18px 22px 40px}
.thread h2{font-size:15px;margin:0}
.thread .sub{color:var(--label-2);font-size:12px;margin:2px 0 16px}
.msg{display:flex;margin:6px 0}
.msg.u{justify-content:flex-end}
.bub{max-width:78%;padding:7px 11px;border-radius:17px;white-space:pre-wrap;word-wrap:break-word}
.u .bub{background:var(--bubble-out);color:#fff;border-bottom-right-radius:5px}
.a .bub{background:var(--bubble-in);border-bottom-left-radius:5px}
.a .bub.mock{background:var(--bad-bg);color:var(--bad)}
.time{color:var(--label-3);font-size:10px;text-align:center;margin:12px 0 4px}
.empty{color:var(--label-3);text-align:center;padding:80px 20px}
.wrap{padding:18px 22px 40px;max-width:1180px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-card)}
.kpi .lb{color:var(--label-2);font-size:12px} .kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.kpi .d{font-size:11px;color:var(--label-3)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.card{background:var(--card);border-radius:12px;padding:14px;box-shadow:var(--shadow-card);min-width:0}
.card h3{margin:0;font-size:13px} .card .hint{color:var(--label-3);font-size:11px;margin:1px 0 10px}
.w8{grid-column:span 8}.w6{grid-column:span 6}.w4{grid-column:span 4}.w12{grid-column:span 12}
@media (max-width:1100px){.w8,.w6,.w4{grid-column:span 12}}
.bars .b{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.bars .b span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--label-2)}
.bars .t{height:8px;border-radius:4px;background:var(--grid);overflow:hidden}.bars .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bars .n{text-align:right;color:var(--label-2);font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--sep);vertical-align:top}
th{color:var(--label-2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
td a{color:var(--accent)}
.st{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px}
.st.done{background:var(--good-bg);color:var(--good)} .st.failed,.st.rejected{background:var(--bad-bg);color:var(--bad)} .st.queued,.st.running{background:var(--warn-bg);color:var(--warn)}
.menu{position:fixed;z-index:9;background:var(--card);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 1px var(--sep);padding:5px;min-width:200px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--accent);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.28);display:grid;place-items:center;z-index:10}
.modal .box{background:var(--card);border-radius:14px;width:min(760px,92vw);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal header{border:0;background:transparent;padding:12px 16px}
.modal .body{overflow:auto;padding:4px 18px 18px;white-space:pre-wrap;line-height:1.55}
.btn{border:0;border-radius:7px;padding:5px 12px;background:var(--control);cursor:pointer}.btn.p{background:var(--accent);color:#fff}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:8px 14px;border-radius:9px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
<div class="app">
  <header>
    <h1>Jossue AI</h1>
    <div class="seg" id="views">
      <button data-v="chats" aria-pressed="true">Conversaciones</button>
      <button data-v="dash" aria-pressed="false">Dashboard</button>
      <button data-v="audits" aria-pressed="false">Auditorías</button>
      <button data-v="calls" aria-pressed="false">Llamadas</button>
      <button data-v="leads" aria-pressed="false">Recados</button>
      <button data-v="alerts" aria-pressed="false">Alertas</button>
    </div>
    <span class="sp"></span>
    <span class="live" id="live"><i></i><span>Conectando…</span></span>
    <button class="tb" id="bRefresh" title="Actualizar ahora" aria-label="Actualizar ahora"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg></button>
    <button class="tb" id="bExport" title="Descargar" aria-label="Descargar" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8m0 0 3-3m-3 3L5 7M2.5 11v2.5h11V11"/></svg></button>
    <button class="tb" id="bAI" title="Resumir con IA" aria-label="Resumir con IA" aria-haspopup="menu"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8l5.1-1.4z"/></svg></button>
  </header>
  <aside>
    <div class="search"><input type="search" id="q" placeholder="Buscar en las conversaciones" autocomplete="off" spellcheck="false"></div>
    <div class="chips" id="chips"></div>
    <div class="dates">Del <input type="date" id="dFrom"> al <input type="date" id="dTo"></div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const short = (ts) => { const d = new Date(ts); return `${d.getDate()} ${MES[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
let D = { conversations: [], leads: [], abuse: [], blocks: [], audits: [] };
let version = -1, view = 'chats', active = null;
const F = { q: '', site: 'todos', flag: 'todas', from: '', to: '' };
const SITES = [['todos','Todos'],['jossuealcala.com','Sitio'],['madre.run','madre.run'],['WhatsApp','WhatsApp']];
const FLAGS = [['todas','Todas'],['lead','Con recado'],['audit','Auditoría'],['interes','2+ preguntas'],['abuse','Abuso']];

function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 5000); }

function visible() {
  const q = F.q.trim().toLowerCase();
  const from = F.from ? new Date(F.from + 'T00:00').getTime() : 0;
  const to = F.to ? new Date(F.to + 'T23:59:59').getTime() : Infinity;
  return D.conversations.filter((c) => {
    if (F.site !== 'todos' && c.site !== F.site) return false;
    if (F.flag === 'lead' && !c.lead) return false;
    if (F.flag === 'audit' && !c.audit) return false;
    if (F.flag === 'interes' && c.turns < 2) return false;
    if (F.flag === 'abuse' && !c.abuse.length && !c.blocked) return false;
    if (c.last < from || c.first > to) return false;
    if (q && !c.messages.some((m) => m.text.toLowerCase().includes(q))) return false;
    return true;
  });
}

function chips() {
  const make = (list, key) => list.map(([v, l]) => `<button class="chip" data-k="${key}" data-v="${esc(v)}" aria-pressed="${F[key] === v}">${l}</button>`).join('');
  $('chips').innerHTML = make(SITES, 'site') + make(FLAGS, 'flag');
}

function tagsOf(c) {
  return [c.lead && '<span class="tag lead">recado</span>', c.audit && '<span class="tag audit">auditoría</span>', (c.abuse.length || c.blocked) && `<span class="tag abuse">${c.blocked ? 'bloqueado' : 'abuso'}</span>`, c.site === 'WhatsApp' && '<span class="tag wa">WhatsApp</span>', c.site === 'madre.run' && '<span class="tag">madre.run</span>', c.qa && '<span class="tag">QA</span>'].filter(Boolean).join('');
}

function paintList() {
  const v = visible();
  $('count').textContent = `${v.length} conversaciones`;
  $('list').innerHTML = v.map((c) => `<button class="row" data-sid="${esc(c.sid)}" aria-current="${c.sid === active}">
    <div class="top"><b>${esc(c.opening || '(sin texto)')}</b><span class="meta">${short(c.last)}</span></div>
    <div class="op">${c.turns} ${c.turns === 1 ? 'pregunta' : 'preguntas'} · ${esc(c.page.replace(/^https?:\/\//, ''))}</div>
    <div class="tags">${tagsOf(c)}</div></button>`).join('') || '<div class="empty">Nada con estos filtros.</div>';
}

function paintThread() {
  const c = D.conversations.find((x) => x.sid === active) || visible()[0];
  if (!c) { $('main').innerHTML = '<div class="empty">Aún no hay conversaciones en la ventana.</div>'; return; }
  active = c.sid;
  let last = 0;
  const msgs = c.messages.map((m) => {
    const gap = m.ts - last > 30 * 60e3 ? `<div class="time">${short(m.ts)}</div>` : '';
    last = m.ts;
    return `${gap}<div class="msg ${m.role === 'user' ? 'u' : 'a'}"><div class="bub${m.mock ? ' mock' : ''}" title="${m.mock ? 'Respuesta de la capa anti abusos' : ''}">${esc(m.text)}</div></div>`;
  }).join('');
  const audit = c.audit ? `<div class="sub">Auditoría: ${esc(c.audit.domain || c.audit.url)} · <span class="st ${esc(c.audit.status)}">${esc(c.audit.status)}</span>${c.audit.score != null ? ` · ${esc(c.audit.score)}/100` : ''}${c.audit.report_url ? ` · <a href="${esc(c.audit.report_url)}" target="_blank" rel="noopener">reporte</a>` : ''}</div>` : '';
  const abuse = c.abuse.length ? `<div class="sub">Alertas: ${c.abuse.map((a) => `${esc(a.kind)} (${esc(a.layer)})`).join(', ')}</div>` : '';
  $('main').innerHTML = `<div class="thread"><h2>${esc(c.opening.slice(0, 90) || 'Conversación')}</h2><div class="sub">${short(c.first)} → ${short(c.last)} · ${esc(c.site)} · ${esc(c.page)} · ${esc(c.locale)} · ${c.turns} preguntas · <code>${esc(c.sid.slice(0, 8))}</code></div>${audit}${abuse}${msgs}</div>`;
  $('main').scrollTop = $('main').scrollHeight;
}

function bars(items, max) {
  const top = Math.max(1, max ?? Math.max(...items.map((i) => i[1]), 1));
  return `<div class="bars">${items.map(([l, n]) => `<div class="b"><span title="${esc(l)}">${esc(l)}</span><span class="t"><i style="width:${(100 * n / top).toFixed(1)}%"></i></span><span class="n">${n}</span></div>`).join('') || '<div class="hint">Sin datos.</div>'}</div>`;
}

function columns(days) {
  const w = 720, h = 140, pad = 18, n = days.length || 1, max = Math.max(1, ...days.map((d) => d[1]));
  const bw = (w - pad * 2) / n;
  const rects = days.map(([d, v, extra], i) => {
    const x = pad + i * bw, bh = (h - 30) * v / max, eh = (h - 30) * (extra || 0) / max;
    return `<rect x="${x + 2}" y="${h - 18 - bh}" width="${Math.max(2, bw - 4)}" height="${bh}" rx="2" fill="var(--grid)"/><rect x="${x + 2}" y="${h - 18 - eh}" width="${Math.max(2, bw - 4)}" height="${eh}" rx="2" fill="var(--accent)"/>${n <= 16 || i % Math.ceil(n / 12) === 0 ? `<text x="${x + bw / 2}" y="${h - 4}" text-anchor="middle">${d.slice(8)}/${d.slice(5, 7)}</text>` : ''}<title>${d}: ${v} conversaciones, ${extra || 0} con interés</title>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Conversaciones por día">${rects}</svg>`;
}

function paintDash() {
  const v = visible(), n = v.length;
  const pct = (k) => n ? Math.round(100 * k / n) + '%' : '—';
  const interest = v.filter((c) => c.turns >= 2).length;
  const leads = v.filter((c) => c.lead).length, audits = v.filter((c) => c.audit).length, abuse = v.filter((c) => c.abuse.length || c.blocked).length;
  const msgs = v.reduce((t, c) => t + c.turns, 0);
  const byDay = new Map(); v.forEach((c) => { const k = dayKey(c.first); const r = byDay.get(k) || [0, 0]; r[0]++; if (c.turns >= 2) r[1]++; byDay.set(k, r); });
  const days = [...byDay.entries()].sort().map(([d, [a, b]]) => [d, a, b]);
  const bySite = new Map(); v.forEach((c) => bySite.set(c.site, (bySite.get(c.site) || 0) + 1));
  const byPage = new Map(); v.forEach((c) => { const p = c.page.replace(/^https?:\/\//, '') || '(sin página)'; byPage.set(p, (byPage.get(p) || 0) + 1); });
  const byHour = Array.from({ length: 24 }, (_, h) => [String(h).padStart(2, '0') + 'h', 0]); v.forEach((c) => byHour[new Date(c.first).getHours()][1]++);
  const openings = new Map(); v.forEach((c) => { const o = c.opening.trim().toLowerCase().replace(/\s+/g, ' ').slice(0, 70); if (o) openings.set(o, (openings.get(o) || 0) + 1); });
  const kinds = new Map(); D.abuse.forEach((a) => kinds.set(a.kind, (kinds.get(a.kind) || 0) + 1));
  const sorted = (m, k = 8) => [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, k);
  $('main').innerHTML = `<div class="wrap">
    <div class="kpis">
      <div class="kpi"><div class="lb">Conversaciones</div><div class="v">${n}</div><div class="d">${msgs} preguntas</div></div>
      <div class="kpi"><div class="lb">Con interés (2+ preguntas)</div><div class="v">${pct(interest)}</div><div class="d">${interest} conversaciones</div></div>
      <div class="kpi"><div class="lb">Recados</div><div class="v">${leads}</div><div class="d">${pct(leads)} de las conversaciones</div></div>
      <div class="kpi"><div class="lb">Auditorías express</div><div class="v">${audits}</div><div class="d">${D.audits.filter((a) => a.status === 'done').length} entregadas en la ventana</div></div>
      <div class="kpi"><div class="lb">Con abuso</div><div class="v">${abuse}</div><div class="d">${D.blocks.length} bloqueos registrados</div></div>
    </div>
    <div class="grid">
      <div class="card w8"><h3>Conversaciones por día</h3><div class="hint">en azul, las que tuvieron 2 preguntas o más</div>${columns(days)}</div>
      <div class="card w4"><h3>Embudo</h3><div class="hint">conversación → interés → auditoría o recado</div>${bars([['Conversaciones', n], ['Con interés', interest], ['Auditoría', audits], ['Recado', leads]], n)}</div>
      <div class="card w6"><h3>Qué preguntan primero</h3><div class="hint">las aperturas más repetidas</div>${bars(sorted(openings))}</div>
      <div class="card w6"><h3>Dónde empiezan</h3><div class="hint">sitio y página</div>${bars([...sorted(bySite, 3), ...sorted(byPage, 6)])}</div>
      <div class="card w6"><h3>Hora del día</h3><div class="hint">hora local en que llega el primer mensaje</div>${bars(byHour.filter((h) => h[1]), null)}</div>
      <div class="card w6"><h3>Tipos de abuso</h3><div class="hint">intentos detectados por la capa en la ventana</div>${bars(sorted(kinds))}</div>
    </div></div>`;
}

function paintAudits() {
  if (!D.auditsAvailable) { $('main').innerHTML = '<div class="empty">Las auditorías express todavía no están activas en la base.</div>'; return; }
  const rows = D.audits.map((a) => `<tr><td>${short(Number(a.created_at))}</td><td>${esc(a.name)}<br><span style="color:var(--label-2)">${esc(a.email)}</span></td><td>${esc(a.domain || a.url)}</td><td><span class="st ${esc(a.status)}">${esc(a.status)}</span>${a.error ? `<br><span style="color:var(--bad)">${esc(a.error)}</span>` : ''}</td><td>${a.score ?? '—'}</td><td>${esc(a.summary || '')}</td><td>${a.report_url ? `<a href="${esc(a.report_url)}" target="_blank" rel="noopener">abrir</a>` : '—'}</td><td>${a.sid ? `<a href="#" data-open="${esc(a.sid)}">chat</a>` : ''}</td></tr>`).join('');
  $('main').innerHTML = `<div class="wrap"><div class="card w12"><h3>Auditorías express</h3><div class="hint">pedidas en el chat · ${D.audits.length} en la ventana</div><table><thead><tr><th>Fecha</th><th>Quién</th><th>Sitio</th><th>Estado</th><th>Puntaje</th><th>Resumen</th><th>Reporte</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="8">Todavía no hay auditorías.</td></tr>'}</tbody></table></div></div>`;
}

const gdl = (ms, opts) => new Intl.DateTimeFormat('es-MX', { timeZone: 'America/Mexico_City', ...opts }).format(new Date(Number(ms)));
const callWhen = (ms) => gdl(ms, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });

function paintCalls() {
  if (!D.callsAvailable) { $('main').innerHTML = '<div class="empty">La agenda todavía no está activa en la base (falta la migración 0006).</div>'; return; }
  const now = Date.now();
  const row = (c) => {
    const digits = String(c.phone).replace(/\D/g, '');
    const live = c.status === 'confirmed';
    const state = live ? (Number(c.slot_end) < now ? '<span class="st">pasó</span>' : '<span class="st done">confirmada</span>') : `<span class="st failed">cancelada${c.cancelled_by === 'jossue' ? ' por ti' : ''}</span>`;
    return `<tr><td><b>${esc(callWhen(c.slot_start))}</b></td><td>${esc(c.name)}<br><span style="color:var(--label-2)">${esc(c.email)}</span></td><td><a href="tel:${esc(c.phone)}">${esc(c.phone)}</a><br><a href="https://wa.me/${esc(digits)}" target="_blank" rel="noopener">WhatsApp</a></td><td>${esc(c.topic || '')}</td><td>${esc(c.source)}</td><td>${state}</td><td>${live && Number(c.slot_start) > now ? `<a href="#" data-cancel="${esc(c.id)}">cancelar</a>` : ''}</td></tr>`;
  };
  const upcoming = D.calls.filter((c) => Number(c.slot_end) >= now);
  const past = D.calls.filter((c) => Number(c.slot_end) < now).reverse();
  const head = '<thead><tr><th>Cuándo (Guadalajara)</th><th>Quién</th><th>Teléfono</th><th>Tema</th><th>Desde</th><th>Estado</th><th></th></tr></thead>';
  const blocks = D.callBlocks.map((b) => `<tr><td>${esc(gdl(Date.parse(b.day + 'T18:00:00Z'), { weekday: 'long', day: 'numeric', month: 'long' }))}</td><td>${esc(b.reason || '')}</td><td><a href="#" data-unblock="${esc(b.day)}">liberar</a></td></tr>`).join('');
  $('main').innerHTML = `<div class="wrap"><div class="grid">
    <div class="card w12"><h3>Próximas llamadas</h3><div class="hint">10 minutos · tú les llamas · martes, miércoles y viernes 10–18 h, sábado 9–13 h · ${upcoming.filter((c) => c.status === 'confirmed').length} confirmadas</div><table>${head}<tbody>${upcoming.map(row).join('') || '<tr><td colspan="7">No hay llamadas agendadas.</td></tr>'}</tbody></table></div>
    <div class="card w6"><h3>Bloquear un día</h3><div class="hint">ese día desaparece de la agenda; las llamadas ya agendadas se quedan</div><p><input type="date" id="blockDay"> <input id="blockReason" placeholder="motivo (opcional)" maxlength="80"> <button class="btn" id="bBlock">Bloquear</button></p><table><thead><tr><th>Día</th><th>Motivo</th><th></th></tr></thead><tbody>${blocks || '<tr><td colspan="3">Sin días bloqueados.</td></tr>'}</tbody></table></div>
    <div class="card w6"><h3>Últimos 7 días</h3><div class="hint">llamadas que ya pasaron</div><table>${head}<tbody>${past.map(row).join('') || '<tr><td colspan="7">Nada todavía.</td></tr>'}</tbody></table></div>
  </div></div>`;
  $('bBlock').onclick = () => agenda('/llamadas/bloquear', { day: $('blockDay').value, reason: $('blockReason').value }, 'Día bloqueado');
}

async function agenda(path, payload, done) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Panel': '1' }, body: JSON.stringify(payload) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) return toast(out.error || 'No se pudo');
  await load(); toast(done);
}

function paintLeads() {
  const rows = D.leads.map((l) => `<tr><td>${esc(String(l.created_at).replace('T', ' ').slice(0, 16))}</td><td>${esc(l.name || '—')}</td><td>${esc([l.email, l.phone].filter(Boolean).join(' · '))}</td><td>${esc(l.company || '')}</td><td>${esc(l.need || '')}</td><td>${esc(l.message || '')}</td><td>${esc(String(l.page || '').replace(/^https?:\/\//, ''))}</td><td>${l.sid ? `<a href="#" data-open="${esc(l.sid)}">chat</a>` : ''}</td></tr>`).join('');
  $('main').innerHTML = `<div class="wrap"><div class="card w12"><h3>Recados para Jossué</h3><div class="hint">los que dejaron nombre y contacto · ${D.leads.length}</div><table><thead><tr><th>Fecha</th><th>Nombre</th><th>Contacto</th><th>Empresa</th><th>Necesita</th><th>Mensaje</th><th>Desde</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="8">Todavía no hay recados.</td></tr>'}</tbody></table></div></div>`;
}

function paintAlerts() {
  const blocks = D.blocks.map((b) => `<tr><td>${esc(String(b.key).slice(0, 14))}…</td><td>${Number(b.until) > Date.now() ? `<span class="st failed">hasta ${short(Number(b.until))}</span>` : `<span class="st">vencido</span>`}</td><td>${esc(b.reason)}</td><td>${esc(b.count)}</td></tr>`).join('');
  const events = D.abuse.map((a) => `<tr><td>${short(a.ts)}</td><td>${esc(a.source)}</td><td><span class="st failed">${esc(a.kind)}</span></td><td>${esc(a.layer)}</td><td>${esc(a.points)}</td><td>${esc(a.excerpt)}</td></tr>`).join('');
  $('main').innerHTML = `<div class="wrap"><div class="grid">
    <div class="card w12"><h3>Intentos de abuso</h3><div class="hint">cada candado que se activó (las filas salen por sesión y por IP)</div><table><thead><tr><th>Fecha</th><th>Canal</th><th>Tipo</th><th>Detectó</th><th>Puntos</th><th>Mensaje</th></tr></thead><tbody>${events || '<tr><td colspan="6">Sin intentos en la ventana.</td></tr>'}</tbody></table></div>
    <div class="card w12"><h3>Bloqueos</h3><div class="hint">huella de la sesión, IP o chat · nunca el dato crudo</div><table><thead><tr><th>Llave</th><th>Estado</th><th>Motivo</th><th>Veces</th></tr></thead><tbody>${blocks || '<tr><td colspan="4">Sin bloqueos.</td></tr>'}</tbody></table></div>
  </div></div>`;
}

function paint() {
  chips(); paintList();
  document.querySelectorAll('#views button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === view));
  ({ chats: paintThread, dash: paintDash, audits: paintAudits, calls: paintCalls, leads: paintLeads, alerts: paintAlerts })[view]();
}

async function load() {
  const r = await fetch('/datos.json'); D = await r.json(); version = D.version; paint();
}

async function beat() {
  try {
    const s = await (await fetch('/estado.json')).json();
    const live = $('live');
    live.className = 'live' + (s.error ? ' err' : s.refreshing ? ' busy' : '');
    live.lastElementChild.textContent = s.error ? 'Error al leer la base' : `${s.auto ? 'En vivo' : 'Manual'} · ${s.refreshedAt ? new Date(s.refreshedAt).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '—'}`;
    live.title = s.error || `Refresca cada ${s.interval} s`;
    if (s.version !== version) { const prev = D.conversations.length; await load(); if (version > 1 && D.conversations.length > prev) toast(`${D.conversations.length - prev} conversación(es) nueva(s)`); }
  } catch { $('live').className = 'live err'; $('live').lastElementChild.textContent = 'Panel desconectado'; }
}

function menu(anchor, items) {
  document.querySelector('.menu')?.remove();
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map(([l], i) => `<button role="menuitem" data-i="${i}">${l}</button>`).join('');
  const r = anchor.getBoundingClientRect(); m.style.top = r.bottom + 6 + 'px'; m.style.right = innerWidth - r.right + 'px';
  document.body.append(m);
  m.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { m.remove(); items[b.dataset.i][1](); } });
  setTimeout(() => addEventListener('pointerdown', (e) => { if (!m.contains(e.target)) m.remove(); }, { once: true }));
}

function download(format, sids) { location.href = `/exportar?formato=${format}&sids=${encodeURIComponent(sids.join(','))}`; }

async function summarize(scope) {
  const sids = scope === 'chat' ? [active] : visible().map((c) => c.sid);
  const modal = document.createElement('div'); modal.className = 'modal';
  modal.innerHTML = `<div class="box"><header><b>Resumen con IA · ${scope === 'chat' ? 'esta conversación' : sids.length + ' conversaciones'}</b><span class="sp"></span><button class="btn" data-copy disabled>Copiar</button> <button class="btn" data-close>Cerrar</button></header><div class="body">Pensando… (usa tu Claude Code; puede tardar un minuto)</div></div>`;
  document.body.append(modal);
  const close = () => modal.remove();
  modal.querySelector('[data-close]').onclick = close; modal.onclick = (e) => { if (e.target === modal) close(); };
  try {
    const r = await fetch('/resumir', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Panel': '1' }, body: JSON.stringify({ sids, scope }) });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error);
    modal.querySelector('.body').textContent = `${out.summary}\n\n— ${out.conversations} de ${out.total} conversaciones · claude/${out.model}`;
    const copy = modal.querySelector('[data-copy]'); copy.disabled = false; copy.onclick = () => navigator.clipboard.writeText(out.summary).then(() => toast('Copiado'));
  } catch (error) { modal.querySelector('.body').textContent = 'No se pudo resumir: ' + error.message; }
}

$('views').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { view = b.dataset.v; paint(); } });
$('chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (b) { F[b.dataset.k] = b.dataset.v; paint(); } });
$('q').addEventListener('input', (e) => { F.q = e.target.value; paint(); });
$('dFrom').addEventListener('change', (e) => { F.from = e.target.value; paint(); });
$('dTo').addEventListener('change', (e) => { F.to = e.target.value; paint(); });
$('list').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r) { active = r.dataset.sid; view = 'chats'; paint(); } });
$('main').addEventListener('click', (e) => {
  const a = e.target.closest('[data-open]'); if (a) { e.preventDefault(); active = a.dataset.open; view = 'chats'; paint(); return; }
  const c = e.target.closest('[data-cancel]'); if (c) { e.preventDefault(); if (confirm('¿Cancelar esta llamada? A la persona no le llega aviso: escríbele tú por WhatsApp.')) agenda('/llamadas/cancelar', { id: c.dataset.cancel }, 'Llamada cancelada'); return; }
  const u = e.target.closest('[data-unblock]'); if (u) { e.preventDefault(); agenda('/llamadas/liberar', { day: u.dataset.unblock }, 'Día liberado'); }
});
$('bRefresh').onclick = async () => { toast('Actualizando…'); await fetch('/refrescar', { method: 'POST', headers: { 'X-Panel': '1' } }); await load(); toast('Listo'); };
$('bExport').onclick = (e) => menu(e.currentTarget, [['Filtro actual · Markdown', () => download('md', visible().map((c) => c.sid))], ['Filtro actual · CSV', () => download('csv', visible().map((c) => c.sid))], ['Filtro actual · JSON', () => download('json', visible().map((c) => c.sid))], ['Esta conversación · Markdown', () => download('md', [active])]]);
$('bAI').onclick = (e) => menu(e.currentTarget, [['Resumir el filtro actual', () => summarize('set')], ['Resumir esta conversación', () => summarize('chat')]]);
addEventListener('keydown', (e) => {
  if (e.target.matches('input')) return;
  const v = visible(); const i = v.findIndex((c) => c.sid === active);
  if (e.key === 'ArrowDown' || e.key === 'j') { active = v[Math.min(v.length - 1, i + 1)]?.sid; view = 'chats'; paint(); }
  if (e.key === 'ArrowUp' || e.key === 'k') { active = v[Math.max(0, i - 1)]?.sid; view = 'chats'; paint(); }
  if (e.key === '/') { e.preventDefault(); $('q').focus(); }
});
load().catch(() => {}); setInterval(beat, 4000); beat();
</script>
</html>
