  Miawseo. ?p=<id>&fmt=wide|tall (1920×1080 / 1080×1920). Cada fotograma sale de
  renderAt(t), que es asíncrona porque busca el cuadro exacto de la grabación;
  render-demo.mjs lo graba cuadro por cuadro.
  Las grabaciones son las demos reales que ya publica el sitio (public/videos/<producto>/).
  Cada frase sale de src/data/products.ts, src/data/productDetails.ts o
  src/components/ChatbotsPage.astro; nada se promete que el sitio no diga.
-->

  .cmp .per { margin-top: 12px; color: var(--ink-2); font-weight: 600; }
  .cmp ul { margin-top: 26px; list-style: none; display: grid; gap: 14px; }
  .cmp li { display: flex; gap: 14px; align-items: baseline; color: var(--ink); font-weight: 600; }
  .cmp li b { color: var(--ink-3); font: 600 20px/1 var(--mono); width: 26px; flex-shrink: 0; }

  .card span { display: block; margin-top: 10px; color: var(--ink-2); line-height: 1.3; }

/* ---------- animación ---------- */
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => cl((t - a) / (b - a));
const out3 = (x) => 1 - Math.pow(1 - x, 3);
const io3 = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const back = (x) => { const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const F = .35; // fundido entre escenas

// Espera a que el cuadro buscado esté pintado (requestVideoFrameCallback), no solo «seeked»:
// sin eso, a veces la captura salía en negro.
const seek = (v, time) => new Promise((ok) => {
  if (Math.abs(v.currentTime - time) < 1 / 120 && v.dataset.painted) return ok();
  let left = 2; const done = () => { if (--left === 0) { clearTimeout(timer); v.dataset.painted = '1'; ok(); } };
  const timer = setTimeout(() => { left = 1; done(); }, 800);
  v.requestVideoFrameCallback(() => done());
  v.addEventListener('seeked', done, { once: true });
  v.currentTime = Math.abs(v.currentTime - time) < 1 / 120 ? time + 1e-3 : time;
});
// Cada video se reproduce un instante al cargar: un video que nunca arrancó puede pintar negro.
const ready = Promise.all([...document.querySelectorAll('video')].map(async (v) => {
  if (v.readyState < 2) await new Promise((ok) => v.addEventListener('loadeddata', ok, { once: true }));
  try { await v.play(); await new Promise((r) => v.requestVideoFrameCallback(r)); } catch {}
  v.pause();
}));

async function renderAt(t) {
  await ready;
  const waits = [];
  SC.forEach((s, i) => {
    const el = document.getElementById(`s${i}`);
    const vis = Math.min(i === 0 ? 1 : p(t, s.a - F / 2, s.a + F / 2), i === SC.length - 1 ? 1 : 1 - p(t, s.b - F / 2, s.b + F / 2));
    el.style.opacity = vis; el.style.visibility = vis > 0 ? 'visible' : 'hidden';
    if (vis <= 0) return;
    const lt = t - s.a;
    // titulares y textos: entran con un pequeño desplazamiento
    el.querySelectorAll('.cap .k, .cap h2, .cap p, .big > *').forEach((n, j) => { const v = out3(p(lt, .1 + j * .12, .55 + j * .12)); n.style.opacity = v; n.style.transform = `translateY(${(1 - v) * 26}px)`; });
    if (s.type === 'intro') {
      const m = back(p(lt, .05, .45)); const mk = el.querySelector('.mark'); mk.style.transform = `scale(${m}) rotate(${(1 - cl(m)) * -18}deg)`; mk.style.opacity = cl(m * 2);
    }
    if (s.type === 'outro') { const u = back(p(lt, .85, 1.2)); const url = el.querySelector('.url'); url.style.transform = `scale(${.7 + .3 * u})`; url.style.opacity = cl(u * 2); }
    if (s.type === 'cards') el.querySelectorAll('.card').forEach((c, j) => { const v = back(p(lt, .7 + j * .32, 1.1 + j * .32)); c.style.opacity = cl(v * 1.6); c.style.transform = `translateY(${(1 - v) * 40}px) scale(${.96 + .04 * v})`; });
    if (s.type === 'compare') {
      el.querySelectorAll('.cmp > div').forEach((c, j) => { const v = back(p(lt, .8 + j * .8, 1.25 + j * .8)); c.style.opacity = cl(v * 1.6); c.style.transform = `translateY(${(1 - v) * 40}px)`;
        c.querySelectorAll('li').forEach((li, k) => { const w = out3(p(lt, 1.4 + j * .8 + k * .2, 1.75 + j * .8 + k * .2)); li.style.opacity = w; }); });
      const fine = el.querySelector('.fine'); fine.style.opacity = out3(p(lt, 3.0, 3.5));
    }
    if (s.type === 'diagram') {
      el.querySelectorAll('.nd').forEach((nd) => { const n = s.nodes[+nd.dataset.n]; const v = back(p(lt, n.at, n.at + .4)); nd.style.opacity = cl(v * 1.6); nd.style.transform = `scale(${.7 + .3 * v})`;
        nd.querySelectorAll('.row').forEach((r, j) => { const w = out3(p(lt, (n.rowAt ?? n.at) + .25 * j, (n.rowAt ?? n.at) + .25 * j + .35)); r.style.opacity = w; r.style.transform = `translateX(${(1 - w) * 30}px)`; }); });
      s.links.forEach(([a, b, at], j) => {
        const path = el.querySelector(`[data-l="${j}"]`), dot = el.querySelector(`[data-d="${j}"]`); const len = path.getTotalLength();
        path.style.strokeDasharray = len; path.style.strokeDashoffset = len * (1 - out3(p(lt, at, at + .5)));
        const loop = lt > at + .5 ? ((lt - at - .5) % 1.4) / 1.4 : -1; const pt = path.getPointAtLength(Math.max(0, loop) * len);
        dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y); dot.style.opacity = loop >= 0 ? Math.sin(loop * Math.PI) : 0;
      });
    }
    if (s.type === 'clip') {
      const fr = el.querySelector('.frame'); const v = out3(p(lt, 0, .5)); fr.style.transform = `translateY(${(1 - v) * 40}px) scale(${.97 + .03 * v})`;
      const [a, b] = s.clip[FMT]; const vt = Math.min(b, a + Math.max(0, lt) * (s.rate ?? 1));
      waits.push(seek(el.querySelector('video'), vt));
      const z = s.zoom?.[FMT]; const zm = el.querySelector('.zoom');
      if (z) { const k = io3(p(lt, 1.6, 2.6)); zm.style.transformOrigin = `${z.x * 100}% ${z.y * 100}%`; zm.style.transform = `scale(${1 + (z.s - 1) * k})`; }
    }
  });
  // progreso
  [...stepsEl.children].forEach((b, i) => { b.firstChild.style.width = `${p(t, story[i].a, story[i].b) * 100}%`; });
  stepsEl.style.opacity = Math.min(p(t, SC[1].a, SC[1].a + .4), 1 - p(t, SC.at(-1).a, SC.at(-1).a + .4));
  document.getElementById('glow').style.transform = `translate(${Math.sin(t * .25) * 40}px, ${Math.cos(t * .2) * 30}px)`;
  document.getElementById('black').style.opacity = p(t, DURATION - .3, DURATION);
  await Promise.all(waits);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
}
// el póster: la primera grabación ya enmarcada, con su texto completo
const POSTER = (SC.find((s) => s.type === 'clip' || s.type === 'diagram')?.a ?? 0) + (SC.some((s) => s.type === 'clip') ? 2.4 : 4.6);
window.DURATION = DURATION; window.REEL = { DURATION, CUES, POSTER, W, H }; window.renderAt = renderAt;
</script>
</body>
