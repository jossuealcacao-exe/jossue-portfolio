<!doctype html>
<meta charset="utf-8" />
<title>Hero loops</title>
<style>
	html, body { margin: 0; background: #050608; }
	canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script>
// Bucles abstractos de 10 s para el héroe de cada ficha de producto. Dibujo determinista:
// renderAt(t) con t en [0, 1) pinta el cuadro entero, sin estado oculto, para que
// render-hero-loops.mjs lo grabe cuadro por cuadro. Todo lo que se mueve es periódico, así
// que el último cuadro engancha con el primero. Nada de texto salvo la marca `.ahp/`.
const TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);
const SCENE = params.get('scene') || 'daniela';
const FORMAT = params.get('fmt') === 'tall' ? 'tall' : 'wide';
const SIZE = FORMAT === 'tall' ? [720, 1280] : [1600, 900];
const [W, H] = SIZE;
const canvas = document.getElementById('c');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');
const U = Math.min(W, H); // unidad de tamaño: el lado corto

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const smooth = (x) => x * x * (3 - 2 * x);
// sube entre a y b, se mantiene, baja entre c y d
const env = (t, a, b, c, d) => smooth(seg(t, a, b)) * (1 - smooth(seg(t, c, d)));
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let s = seed >>> 0; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }

const IVORY = '236,230,216';
const STAR = '223,230,255';

// ---------- fondo: nebulosa, estrellas y grano, igual que el logotipo ----------
const rand = rng(7);
const stars = Array.from({ length: FORMAT === 'tall' ? 150 : 240 }, () => ({
	x: rand() * W, y: rand() * H, r: 0.35 + Math.pow(rand(), 3) * 1.5,
	base: 0.25 + rand() * 0.6, ph: rand() * TAU, f: 1 + Math.floor(rand() * 3), dx: (rand() - 0.5) * 10, dy: (rand() - 0.5) * 8,
}));
const grain = (() => {
	const g = document.createElement('canvas'); g.width = 256; g.height = 256;
	const gc = g.getContext('2d'); const img = gc.createImageData(256, 256); const r = rng(99);
	for (let i = 0; i < img.data.length; i += 4) { const v = 118 + r() * 30; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 13; }
	gc.putImageData(img, 0, 0); return gc.createPattern(g, 'repeat');
})();

function blob(x, y, r, rgb, a) {
	const g = ctx.createRadialGradient(x, y, 0, x, y, r);
	g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
	ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function background(t, tint) {
	const a = t * TAU;
	ctx.fillStyle = '#04050a'; ctx.fillRect(0, 0, W, H);
	const R = Math.max(W, H);
	blob(W * (0.26 + 0.03 * Math.sin(a)), H * (0.30 + 0.025 * Math.cos(a)), R * 0.62, '30,38,92', 0.62);
	blob(W * (0.76 + 0.025 * Math.cos(a)), H * (0.72 + 0.03 * Math.sin(a)), R * 0.55, '58,32,86', 0.46);
	blob(W * 0.5, H * (0.5 + 0.02 * Math.sin(a + 1)), R * 0.42, '70,92,150', 0.16);
	if (tint) blob(W * tint.x, H * tint.y, R * tint.r, tint.rgb, tint.a * (0.8 + 0.2 * Math.sin(a * 2)));
	for (const s of stars) {
		const k = 0.55 + 0.45 * Math.sin(a * s.f + s.ph);
		const x = s.x + s.dx * Math.sin(a + s.ph), y = s.y + s.dy * Math.cos(a + s.ph);
		ctx.globalAlpha = s.base * k;
		ctx.fillStyle = `rgb(${STAR})`;
		ctx.beginPath(); ctx.arc(x, y, s.r, 0, TAU); ctx.fill();
		if (s.r > 1.2) { ctx.globalAlpha *= 0.25; ctx.beginPath(); ctx.arc(x, y, s.r * 3.2, 0, TAU); ctx.fill(); }
	}
	ctx.globalAlpha = 1;
}
function finish() {
	// grano estático, viñeta y una zona calma en el centro para que el titular se lea
	ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H);
	const v = ctx.createRadialGradient(W / 2, H / 2, U * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
	v.addColorStop(0, 'rgba(2,3,6,0)'); v.addColorStop(1, 'rgba(2,3,6,0.7)');
	ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
	const c = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, FORMAT === 'tall' ? W * 0.62 : W * 0.36);
	c.addColorStop(0, 'rgba(4,5,9,0.5)'); c.addColorStop(1, 'rgba(4,5,9,0)');
	ctx.fillStyle = c; ctx.fillRect(0, 0, W, H);
}

// ---------- primitivas ----------
function rr(x, y, w, h, r) {
	r = Math.min(r, w / 2, h / 2);
	ctx.beginPath();
	ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
	ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glass(x, y, w, h, r, a = 1, edge = 0.22, hi = 0) {
	if (a <= 0.003) return;
	ctx.save(); ctx.globalAlpha = a;
	rr(x, y, w, h, r);
	const g = ctx.createLinearGradient(x, y, x, y + h);
	g.addColorStop(0, `rgba(196,206,246,${0.15 + hi * 0.14})`); g.addColorStop(1, `rgba(120,132,196,${0.06 + hi * 0.08})`);
	ctx.fillStyle = g; ctx.fill();
	ctx.lineWidth = 1.2; ctx.strokeStyle = `rgba(${IVORY},${edge + hi * 0.28})`; ctx.stroke();
	ctx.restore();
}
function node(x, y, r, a = 1) {
	if (a <= 0.003) return;
	ctx.save(); ctx.globalAlpha = a;
	const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.4);
	g.addColorStop(0, 'rgba(255,248,232,0.9)'); g.addColorStop(0.35, `rgba(${IVORY},0.45)`); g.addColorStop(1, `rgba(${IVORY},0)`);
	ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.4, 0, TAU); ctx.fill();
	ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
	ctx.restore();
}
function line(x1, y1, x2, y2, a = 0.3, w = 1) {
	if (a <= 0.003) return;
	ctx.strokeStyle = `rgba(${IVORY},${a})`; ctx.lineWidth = w; ctx.lineCap = 'round';
	ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ring(x, y, r, a, w = 1.4) {
	if (a <= 0.003) return;
	ctx.strokeStyle = `rgba(${IVORY},${a})`; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
}
function check(x, y, s, a, w = 2) {
	if (a <= 0.003) return;
	ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
	ctx.beginPath(); ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x - s * 0.1, y + s * 0.4); ctx.lineTo(x + s * 0.55, y - s * 0.4); ctx.stroke(); ctx.restore();
}
// camino por puntos (con esquinas redondeadas) para trenes y paquetes
function smoothPath(pts, radius) {
	const out = [pts[0]];
	for (let i = 1; i < pts.length - 1; i++) {
		const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
		const d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
		const r = Math.min(radius, d1 / 2, d2 / 2);
		const a = [p1[0] + ((p0[0] - p1[0]) / d1) * r, p1[1] + ((p0[1] - p1[1]) / d1) * r];
		const b = [p1[0] + ((p2[0] - p1[0]) / d2) * r, p1[1] + ((p2[1] - p1[1]) / d2) * r];
		for (let k = 0; k <= 8; k++) { const s = k / 8; out.push([(1 - s) * (1 - s) * a[0] + 2 * (1 - s) * s * p1[0] + s * s * b[0], (1 - s) * (1 - s) * a[1] + 2 * (1 - s) * s * p1[1] + s * s * b[1]]); }
	}
	out.push(pts[pts.length - 1]);
	let len = 0; const cum = [0];
	for (let i = 1; i < out.length; i++) { len += Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]); cum.push(len); }
	return { pts: out, cum, len };
}
function at(path, p) {
	const d = clamp(p) * path.len; let i = 1;
	while (i < path.cum.length - 1 && path.cum[i] < d) i++;
	const k = (d - path.cum[i - 1]) / Math.max(1e-6, path.cum[i] - path.cum[i - 1]);
	const a = path.pts[i - 1], b = path.pts[i];
	return { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}
function strokePath(path, a, w = 1, dash) {
	ctx.save(); ctx.strokeStyle = `rgba(${IVORY},${a})`; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
	if (dash) ctx.setLineDash(dash);
	ctx.beginPath(); path.pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); ctx.restore();
}
// curva suave entre dos puntos (para los paquetes que viajan)
function arcPath(x1, y1, x2, y2, bend) {
	const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, n = Math.hypot(dx, dy) || 1;
	const cx = mx - (dy / n) * bend, cy = my + (dx / n) * bend;
	const pts = []; for (let k = 0; k <= 36; k++) { const s = k / 36; pts.push([(1 - s) * (1 - s) * x1 + 2 * (1 - s) * s * cx + s * s * x2, (1 - s) * (1 - s) * y1 + 2 * (1 - s) * s * cy + s * s * y2]); }
	let len = 0; const cum = [0]; for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(len); }
	return { pts, cum, len };
}
// paquete con cola
function packet(path, p, a = 1, r = 3.2) {
	if (p <= 0 || p >= 1 || a <= 0.003) return;
	for (let k = 7; k >= 1; k--) { const q = at(path, p - k * 0.012); if (p - k * 0.012 < 0) continue; node(q.x, q.y, r * (1 - k * 0.1), a * (1 - k / 8) * 0.55); }
	const q = at(path, p); node(q.x, q.y, r, a);
}
function bottle(x, y, w, h, a, hi) {
	glass(x, y + h * 0.16, w, h * 0.84, w * 0.28, a, 0.22, hi);
	glass(x + w * 0.2, y, w * 0.6, h * 0.2, w * 0.12, a, 0.26, hi);
	ctx.save(); ctx.globalAlpha = a * 0.5; ctx.fillStyle = `rgba(${IVORY},0.18)`; rr(x + w * 0.2, y + h * 0.5, w * 0.6, h * 0.05, 2); ctx.fill(); rr(x + w * 0.28, y + h * 0.6, w * 0.44, h * 0.04, 2); ctx.fill(); ctx.restore();
}
function bubble(x, y, w, h, tail, a, fill = 0, hi = 0) {
	if (a <= 0.003) return;
	glass(x, y, w, h, h * 0.42, a, 0.2, hi);
	ctx.save(); ctx.globalAlpha = a * 0.7; ctx.strokeStyle = `rgba(${IVORY},0.2)`; ctx.lineWidth = 1.2;
	ctx.beginPath(); if (tail === 'left') { ctx.moveTo(x + h * 0.25, y + h); ctx.lineTo(x + h * 0.05, y + h * 1.3); ctx.lineTo(x + h * 0.55, y + h); } else { ctx.moveTo(x + w - h * 0.25, y + h); ctx.lineTo(x + w - h * 0.05, y + h * 1.3); ctx.lineTo(x + w - h * 0.55, y + h); } ctx.stroke(); ctx.restore();
	if (fill > 0) { ctx.save(); ctx.globalAlpha = a * fill * 0.55; ctx.fillStyle = `rgba(${IVORY},0.35)`; rr(x + h * 0.4, y + h * 0.3, w * 0.62 * fill, h * 0.12, 3); ctx.fill(); if (h > U * 0.07) { rr(x + h * 0.4, y + h * 0.55, w * 0.42 * fill, h * 0.12, 3); ctx.fill(); } ctx.restore(); }
}
function dots(x, y, t, a) {
	for (let i = 0; i < 3; i++) { const k = 0.35 + 0.65 * Math.max(0, Math.sin(t * TAU * 8 - i * 0.9)); ctx.save(); ctx.globalAlpha = a * k; ctx.fillStyle = `rgba(${IVORY},0.9)`; ctx.beginPath(); ctx.arc(x + i * 13, y, 3.4, 0, TAU); ctx.fill(); ctx.restore(); }
}
const P = (x, y) => [x * W, y * H];

// ---------- escenas ----------
const SCENES = {
	// Una conversación que llega al catálogo, el servidor lo revisa y termina en el carrito.
	daniela(t) {
		const w = FORMAT === 'wide';
		const L = w
			? { b1: [0.07, 0.30], b2: [0.06, 0.46], b3: [0.09, 0.64], srv: [0.46, 0.13], cat: [0.62, 0.20], c1: [0.74, 0.26], c2: [0.82, 0.38], c3: [0.90, 0.28], cart: [0.84, 0.76] }
			: { b1: [0.12, 0.12], b2: [0.08, 0.22], b3: [0.14, 0.33], srv: [0.50, 0.46], cat: [0.50, 0.58], c1: [0.20, 0.70], c2: [0.50, 0.74], c3: [0.78, 0.70], cart: [0.50, 0.90] };
		const bw = w ? U * 0.34 : W * 0.5, bh = w ? U * 0.075 : H * 0.045;
		const [b1x, b1y] = P(...L.b1), [b2x, b2y] = P(...L.b2), [b3x, b3y] = P(...L.b3);
		const [sx, sy] = P(...L.srv), [kx, ky] = P(...L.cat);
		const cs = [L.c1, L.c2, L.c3].map((q) => P(...q));
		const [cx, cy] = P(...L.cart);
		// constelación de fondo
		const base = [[b1x + bw, b1y + bh / 2], [sx, sy], [kx, ky], ...cs, [cx, cy]];
		line(base[0][0], base[0][1], sx, sy, 0.2); line(sx, sy, kx, ky, 0.26);
		cs.forEach(([x, y]) => line(kx, ky, x, y + U * 0.04, 0.2)); line(cs[1][0] + U * 0.03, cs[1][1] + U * 0.15, cx, cy, 0.18);
		// burbujas
		const e1 = env(t, 0.03, 0.1, 0.9, 0.97), e2 = env(t, 0.12, 0.2, 0.9, 0.97), e3 = env(t, 0.5, 0.57, 0.9, 0.97);
		bubble(b1x, b1y, bw * 0.78, bh, 'right', e1, smooth(seg(t, 0.06, 0.13)));
		const typing = seg(t, 0.14, 0.26) < 1 && t > 0.14;
		bubble(b2x, b2y, bw, bh * 1.55, 'left', e2, smooth(seg(t, 0.26, 0.36)), 0.1);
		if (typing) dots(b2x + bh * 0.8, b2y + bh * 0.78, t, e2);
		bubble(b3x, b3y, bw * 0.55, bh, 'right', e3, smooth(seg(t, 0.52, 0.58)));
		node(b1x + bw * 0.78 + 14, b1y + bh / 2, 2.2, e1 * 0.8);
		// servidor: guardia con un anillo que late cuando valida
		node(sx, sy, 4, 0.9);
		const v1 = env(t, 0.2, 0.26, 0.34, 0.4), v2 = env(t, 0.72, 0.78, 0.84, 0.9);
		const pr = (v) => ring(sx, sy, 16 + 22 * (1 - v), v * 0.6);
		pr(v1); pr(v2); check(sx, sy - 0.5, 8, Math.max(v1, v2) * 0.9, 1.8);
		ring(sx, sy, 12, 0.22 + 0.1 * Math.sin(t * TAU * 2));
		node(kx, ky, 3.2, 0.8);
		// paquetes
		packet(arcPath(b1x + bw * 0.78, b1y + bh / 2, sx, sy, -U * 0.08), seg(t, 0.1, 0.2), env(t, 0.1, 0.12, 0.18, 0.2));
		packet(arcPath(sx, sy, kx, ky, U * 0.02), seg(t, 0.36, 0.44), 1);
		// tarjetas de producto: una se elige
		const pick = env(t, 0.46, 0.54, 0.66, 0.74);
		cs.forEach(([x, y], i) => {
			const a = env(t, 0.38 + i * 0.03, 0.46 + i * 0.03, 0.9, 0.97);
			const hi = i === 1 ? pick : 0;
			const s = 1 + hi * 0.12;
			ctx.save(); ctx.translate(x + U * 0.03, y + U * 0.07); ctx.scale(s, s); ctx.translate(-(x + U * 0.03), -(y + U * 0.07));
			bottle(x, y, U * 0.062, U * 0.14, a, hi); ctx.restore();
			ctx.save(); ctx.globalAlpha = a * 0.5; ctx.fillStyle = `rgba(${IVORY},0.3)`; rr(x - U * 0.005, y + U * 0.16, U * 0.07, U * 0.014, 3); ctx.fill(); ctx.restore();
		});
		packet(arcPath(cs[1][0] + U * 0.03, cs[1][1] + U * 0.15, cx, cy - U * 0.05, U * 0.06), seg(t, 0.58, 0.72), 1);
		packet(arcPath(sx, sy, cs[1][0] + U * 0.03, cs[1][1], -U * 0.05), seg(t, 0.44, 0.52), env(t, 0.44, 0.46, 0.5, 0.52));
		// carrito
		const ca = env(t, 0.5, 0.6, 0.9, 0.97), pop = 1 + 0.18 * env(t, 0.72, 0.75, 0.78, 0.84);
		ctx.save(); ctx.globalAlpha = ca; ctx.translate(cx, cy); ctx.scale(pop, pop);
		ctx.strokeStyle = `rgba(${IVORY},0.5)`; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
		ctx.beginPath(); ctx.moveTo(-U * 0.05, -U * 0.02); ctx.lineTo(U * 0.05, -U * 0.02); ctx.lineTo(U * 0.038, U * 0.05); ctx.lineTo(-U * 0.038, U * 0.05); ctx.closePath(); ctx.stroke();
		ctx.beginPath(); ctx.moveTo(-U * 0.03, -U * 0.02); ctx.lineTo(-U * 0.012, -U * 0.055); ctx.moveTo(U * 0.03, -U * 0.02); ctx.lineTo(U * 0.012, -U * 0.055); ctx.stroke();
		ctx.restore();
		check(cx, cy + U * 0.012, 9, env(t, 0.74, 0.78, 0.86, 0.92) * 0.9, 2);
	},

	// El relevo de AHP+: cuatro agentes, una carpeta compartida y un historial que avanza.
	ahp(t) {
		const w = FORMAT === 'wide';
		const L = w
			? { a: [[0.10, 0.24], [0.90, 0.24], [0.90, 0.64], [0.10, 0.64]], led: [0.5, 0.80], git: 0.935 }
			: { a: [[0.18, 0.12], [0.82, 0.12], [0.82, 0.88], [0.18, 0.88]], led: [0.5, 0.80], git: 0.965 };
		const A = L.a.map((q) => P(...q));
		const [lx, ly] = P(...L.led);
		const lw = w ? U * 0.5 : W * 0.5, lh = w ? U * 0.15 : H * 0.075;
		const gy = L.git * H;
		// historial: línea con confirmaciones (commits) que se encienden en cada relevo
		line(W * 0.04, gy, W * 0.96, gy, 0.12);
		const nc = 12;
		for (let i = 0; i < nc; i++) { const x = lerp(W * 0.06, W * 0.94, i / (nc - 1)); const lit = clamp(0.25 + 0.75 * seg(t * nc * 1.0, i - 0.2, i + 0.6)); node(x, gy, 2.1, 0.35 + lit * 0.55 * (i / nc < t + 0.04 ? 1 : 0.45)); }
		// carpeta .ahp/
		const pulse = 0.5 + 0.5 * Math.sin(t * TAU * 4);
		glass(lx - lw / 2, ly - lh / 2, lw, lh, 14, 1, 0.22, 0.25 * pulse);
		ctx.save(); ctx.fillStyle = `rgba(${IVORY},0.82)`; ctx.font = `600 ${Math.round(lh * 0.34)}px ui-monospace, 'SF Mono', Menlo, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
		ctx.fillText('.ahp/', lx, ly - lh * 0.12);
		ctx.globalAlpha = 0.35; ctx.fillRect(lx - lw * 0.32, ly + lh * 0.24, lw * 0.64, 2); ctx.globalAlpha = 0.22; ctx.fillRect(lx - lw * 0.32, ly + lh * 0.34, lw * 0.4, 2); ctx.restore();
		// agentes: una forma distinta cada uno
		const shape = (i, x, y, s, a, hi) => {
			glass(x - s, y - s, s * 2, s * 2, s * 0.5, a, 0.24, hi);
			ctx.save(); ctx.globalAlpha = a * (0.55 + hi * 0.45); ctx.strokeStyle = `rgba(${IVORY},0.9)`; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.beginPath();
			if (i === 0) ctx.arc(x, y, s * 0.42, 0, TAU);
			if (i === 1) { ctx.rect(x - s * 0.36, y - s * 0.36, s * 0.72, s * 0.72); }
			if (i === 2) { ctx.moveTo(x, y - s * 0.44); ctx.lineTo(x + s * 0.44, y + s * 0.36); ctx.lineTo(x - s * 0.44, y + s * 0.36); ctx.closePath(); }

	// Bloqio Builder: bloques que se acomodan en una página, se revisan uno por uno y se ven en el teléfono.

	// Miawseo: una red de metro con trenes y estaciones que se abren como salas.
	miawseo(t) {
		const w = FORMAT === 'wide';
		const lines = w
			? [
				{ c: '236,230,216', pts: [[0.02, 0.22], [0.30, 0.22], [0.38, 0.12], [0.70, 0.12], [0.78, 0.22], [0.98, 0.22]] },
				{ c: '168,184,255', pts: [[0.02, 0.80], [0.22, 0.80], [0.30, 0.90], [0.66, 0.90], [0.74, 0.80], [0.98, 0.80]] },

		rooms.forEach(([x, y, at0], i) => {

	// Consultoría: una tienda que se revisa de arriba abajo, el embudo con su fuga y el plan por prioridad.
	consultoria(t) {

			ring(px + 8, yy + 4, 7, a * 0.5, 1.3); check(px + 8, yy + 4.4, 6, a * smooth(seg(t, 0.64 + i * 0.08, 0.7 + i * 0.08)), 1.6);

	// Desarrollo web: la tienda se arma en escritorio y teléfono, y un paquete recorre alcance → diseño → construcción → entrega.
	web(t) {
		const w = FORMAT === 'wide';
		const dx = w ? W * 0.06 : W * 0.1, dy = w ? H * 0.14 : H * 0.04, dw = w ? W * 0.33 : W * 0.8, dh = w ? H * 0.58 : H * 0.28;
		glass(dx, dy, dw, dh, 14, 1, 0.2, 0);

			const a = env(t, ph0 - 0.15, ph0 - 0.05, ph0 + 0.1, ph0 + 0.2) * (w ? 1 : 0.8), gx = (w ? x : 0.12 + i * 0.3) * W, gy = (w ? y : 0.72 + i * 0.03) * H;

		if (w) dots(px + 26, py + 40 + 1 * (bh + 26) + bh / 2, t, env(t, 0.13, 0.15, 0.19, 0.2));
		// lo que sabe el asistente: un producto, preguntas frecuentes y un precio
		const cards = w ? [[0.76, 0.18], [0.8, 0.44], [0.76, 0.68]] : [[0.06, 0.88], [0.38, 0.9], [0.7, 0.88]];
		const cw = w ? W * 0.17 : W * 0.24, ch = w ? H * 0.16 : H * 0.07;
		cards.forEach(([cx, cy], i) => {
			const x = cx * W, y = cy * H, hi = env(t, 0.14 + i * 0.22, 0.17 + i * 0.22, 0.22 + i * 0.22, 0.27 + i * 0.22);
			glass(x, y, cw, ch, 12, 1, 0.26, hi * 0.6);
			ctx.save(); ctx.globalAlpha = 0.6 + hi * 0.4; ctx.fillStyle = `rgba(${IVORY},0.42)`;
			if (i === 0) { rr(x + 12, y + 12, ch - 24, ch - 24, 8); ctx.fill(); rr(x + ch, y + ch * 0.3, cw - ch - 14, 7, 3); ctx.fill(); rr(x + ch, y + ch * 0.55, (cw - ch) * 0.5, 7, 3); ctx.fill(); }
			if (i === 1) { for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(x + 16, y + ch * (0.28 + k * 0.24), 3, 0, TAU); ctx.fill(); rr(x + 28, y + ch * (0.28 + k * 0.24) - 3, cw * (0.7 - k * 0.12), 6, 3); ctx.fill(); } }
			if (i === 2) { rr(x + 12, y + ch * 0.3, cw * 0.4, ch * 0.4, 6); ctx.fill(); rr(x + cw * 0.55, y + ch * 0.42, cw * 0.32, 7, 3); ctx.fill(); }
			ctx.restore();
			const to = arcPath(x, y + ch / 2, px + pw, py + ph * (w ? 0.4 : 0.6), w ? U * 0.12 : -U * 0.1);
			packet(to, seg(t, 0.17 + i * 0.22, 0.29 + i * 0.22), env(t, 0.17 + i * 0.22, 0.19 + i * 0.22, 0.27 + i * 0.22, 0.29 + i * 0.22));
		});
		// escudo: el asistente se protege de abusos
		const [sx, sy] = w ? [W * 0.93, H * 0.12] : [W * 0.92, H * 0.83];
		ctx.save(); ctx.strokeStyle = `rgba(${IVORY},0.7)`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(sx, sy - 13); ctx.lineTo(sx + 11, sy - 8); ctx.lineTo(sx + 11, sy + 1); ctx.quadraticCurveTo(sx + 11, sy + 10, sx, sy + 15); ctx.quadraticCurveTo(sx - 11, sy + 10, sx - 11, sy + 1); ctx.lineTo(sx - 11, sy - 8); ctx.closePath(); ctx.stroke(); ctx.restore();
		ring(sx, sy, 20 + 6 * Math.sin(t * TAU * 2), 0.18, 1.2);
	},

	// Productos: cuatro productos con su ícono que se encienden por turno.
	products(t) {
		const w = FORMAT === 'wide';
		const C = w ? [[0.12, 0.3], [0.1, 0.66], [0.88, 0.3], [0.9, 0.66]] : [[0.14, 0.055], [0.86, 0.055], [0.14, 0.93], [0.86, 0.93]];
		const s = w ? U * 0.075 : W * 0.085;
		const leg = Math.floor(t * 4) % 4, lt = (t * 4) % 1;
		C.forEach(([cx, cy], i) => {
			const bob = Math.sin(t * TAU + i * 1.4) * (w ? 8 : 4), x = cx * W, y = cy * H + bob;
			const hi = i === leg ? env(lt, 0.05, 0.25, 0.7, 0.95) : 0;
			glass(x - s, y - s, s * 2, s * 2, s * 0.5, 1, 0.3, hi * 0.6);
			ctx.save(); ctx.globalAlpha = 0.7 + hi * 0.3; ctx.strokeStyle = `rgba(${IVORY},0.95)`; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath(); const k = s * 0.48;
			if (i === 0) { rr(x - k, y - k * 0.7, k * 2, k * 1.25, k * 0.4); ctx.moveTo(x - k * 0.4, y + k * 0.55); ctx.lineTo(x - k * 0.6, y + k * 0.9); ctx.lineTo(x, y + k * 0.55); }
			if (i === 1) { rr(x - k, y - k * 0.75, k * 2, k * 1.5, 5); ctx.moveTo(x - k * 0.55, y - k * 0.2); ctx.lineTo(x - k * 0.15, y + k * 0.1); ctx.lineTo(x - k * 0.55, y + k * 0.4); ctx.moveTo(x + k * 0.05, y + k * 0.45); ctx.lineTo(x + k * 0.55, y + k * 0.45); }
			if (i === 2) { ctx.moveTo(x, y - k); ctx.lineTo(x + k, y - k * 0.45); ctx.lineTo(x, y + k * 0.1); ctx.lineTo(x - k, y - k * 0.45); ctx.closePath(); ctx.moveTo(x - k, y); ctx.lineTo(x, y + k * 0.55); ctx.lineTo(x + k, y); ctx.moveTo(x - k, y + k * 0.45); ctx.lineTo(x, y + k); ctx.lineTo(x + k, y + k * 0.45); }
			if (i === 3) { ctx.moveTo(x, y - k); ctx.lineTo(x + k * 0.9, y - k * 0.5); ctx.lineTo(x + k * 0.9, y + k * 0.5); ctx.lineTo(x, y + k); ctx.lineTo(x - k * 0.9, y + k * 0.5); ctx.lineTo(x - k * 0.9, y - k * 0.5); ctx.closePath(); ctx.moveTo(x - k * 0.9, y - k * 0.5); ctx.lineTo(x, y); ctx.lineTo(x + k * 0.9, y - k * 0.5); ctx.moveTo(x, y); ctx.lineTo(x, y + k); }
			ctx.stroke(); ctx.restore();
			ring(x, y, s * 1.3 + (1 - hi) * 14, hi * 0.5, 1.4);
			const nx = (C[(i + 1) % 4][0]) * W, ny = C[(i + 1) % 4][1] * H;
			if (i === leg) packet(arcPath(x, y, nx, ny, (i % 2 ? -1 : 1) * (w ? U * 0.05 : W * 0.05)), seg(lt, 0.55, 0.95), env(lt, 0.55, 0.6, 0.9, 0.95), 2.8);
		});
	},

	// Servicios: reviso la tienda, la mejoro y la venta sube.
	services(t) {
		const w = FORMAT === 'wide';
		const sx = w ? W * 0.05 : W * 0.12, sy = w ? H * 0.2 : H * 0.012, sw = w ? W * 0.22 : W * 0.76, sh = w ? H * 0.54 : H * 0.12;
		glass(sx, sy, sw, sh, 14, 1, 0.3, 0);
		line(sx, sy + 28, sx + sw, sy + 28, 0.18);
		const blocks = w ? [[0.06, 0.16, 0.88, 0.26], [0.06, 0.48, 0.42, 0.42], [0.52, 0.48, 0.42, 0.42]] : [[0.04, 0.42, 0.28, 0.48], [0.36, 0.42, 0.28, 0.48], [0.68, 0.42, 0.28, 0.48]];
		blocks.forEach(([bx, by, bw, bh], i) => {
			const fix = env(t, 0.3 + i * 0.1, 0.36 + i * 0.1, 0.9, 0.97);
			glass(sx + sw * bx, sy + sh * by, sw * bw, sh * bh, 8, 1, 0.22 + fix * 0.2, fix * 0.4);
			check(sx + sw * (bx + bw) - 12, sy + sh * by + 12, 6, fix, 1.6);
		});
		// lupa que recorre la tienda
		const mt = seg(t, 0.04, 0.3), mx = sx + sw * lerp(0.2, 0.8, ease(mt)), my = sy + sh * lerp(0.35, 0.7, Math.sin(mt * Math.PI)), ma = env(t, 0.04, 0.08, 0.28, 0.32);
		ring(mx, my, w ? 22 : 14, ma * 0.8, 2); line(mx + (w ? 16 : 10), my + (w ? 16 : 10), mx + (w ? 30 : 18), my + (w ? 30 : 18), ma * 0.8, 3);
		// venta que sube
		const cx0 = w ? W * 0.74 : W * 0.06, cy0 = w ? H * 0.5 : H * 0.89, cw = w ? W * 0.21 : W * 0.5, ch = w ? H * 0.3 : H * 0.08;
		line(cx0, cy0 + ch, cx0 + cw, cy0 + ch, 0.22);
		const vals = [0.25, 0.3, 0.28, 0.42, 0.55, 0.72, 0.9], fade = 1 - smooth(seg(t, 0.92, 0.99));
		vals.forEach((v, i) => { const g = outCubic(seg(t, 0.5 + i * 0.05, 0.58 + i * 0.05)); const bwid = cw / vals.length - 8, x = cx0 + i * (cw / vals.length) + 4, hh = ch * v * g; ctx.save(); ctx.globalAlpha = fade * (0.35 + 0.4 * (i / vals.length)); ctx.fillStyle = `rgba(${IVORY},0.3)`; rr(x, cy0 + ch - hh, bwid, hh, 4); ctx.fill(); ctx.restore(); });
		const [kx, ky] = w ? [W * 0.86, H * 0.28] : [W * 0.84, H * 0.84];
		ctx.save(); ctx.globalAlpha = 0.85; ctx.strokeStyle = `rgba(${IVORY},0.8)`; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; const u = w ? U * 0.045 : W * 0.05;
		ctx.beginPath(); ctx.moveTo(kx - u, ky - u * 0.4); ctx.lineTo(kx + u, ky - u * 0.4); ctx.lineTo(kx + u * 0.75, ky + u * 0.9); ctx.lineTo(kx - u * 0.75, ky + u * 0.9); ctx.closePath(); ctx.stroke();
		ctx.beginPath(); ctx.moveTo(kx - u * 0.55, ky - u * 0.4); ctx.lineTo(kx - u * 0.2, ky - u * 1.05); ctx.moveTo(kx + u * 0.55, ky - u * 0.4); ctx.lineTo(kx + u * 0.2, ky - u * 1.05); ctx.stroke(); ctx.restore();
		check(kx, ky + u * 0.25, 9, env(t, 0.72, 0.76, 0.86, 0.92), 2);
		packet(arcPath(sx + sw, sy + sh * 0.5, kx - u, ky, w ? -U * 0.12 : U * 0.08), seg(t, 0.4, 0.62), env(t, 0.4, 0.43, 0.59, 0.62));
		packet(arcPath(kx, ky + u, cx0 + cw * 0.8, cy0 + ch * 0.2, w ? U * 0.05 : -U * 0.04), seg(t, 0.64, 0.78), env(t, 0.64, 0.66, 0.76, 0.78));
	},

	// Casos: proyectos que se revisan uno por uno y quedan palomeados.
	work(t) {
		const w = FORMAT === 'wide';
		const P0 = w ? [[0.04, 0.2], [0.12, 0.52], [0.78, 0.18], [0.82, 0.5]] : [[0.06, 0.015], [0.54, 0.015], [0.06, 0.885], [0.54, 0.885]];
		const fw = w ? W * 0.17 : W * 0.4, fh = w ? H * 0.24 : H * 0.095;
		P0.forEach(([cx, cy], i) => {
			const drift = Math.sin(t * TAU + i) * (w ? 6 : 3), x = cx * W, y = cy * H + drift;
			const hi = env(t, 0.06 + i * 0.22, 0.12 + i * 0.22, 0.2 + i * 0.22, 0.26 + i * 0.22);
			const done = smooth(seg(t, 0.14 + i * 0.22, 0.2 + i * 0.22)) * (1 - smooth(seg(t, 0.92, 0.99)));
			glass(x, y, fw, fh, 12, 1, 0.3, hi * 0.55);
			for (let k = 0; k < 3; k++) { ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = `rgba(${IVORY},0.45)`; ctx.beginPath(); ctx.arc(x + 12 + k * 10, y + 11, 2.6, 0, TAU); ctx.fill(); ctx.restore(); }
			line(x, y + 22, x + fw, y + 22, 0.16);
			ctx.save(); ctx.globalAlpha = 0.5 + hi * 0.4; ctx.fillStyle = `rgba(${IVORY},0.32)`; rr(x + 10, y + 30, fw * 0.55, fh * 0.28, 6); ctx.fill(); rr(x + fw * 0.62, y + 30, fw * 0.3, fh * 0.28, 6); ctx.fill(); rr(x + 10, y + 30 + fh * 0.34, fw * 0.8, 6, 3); ctx.fill(); ctx.restore();
			ring(x + fw - 14, y + fh - 14, 9, done * 0.5, 1.4); check(x + fw - 14, y + fh - 13.5, 7, done, 1.8);
			// una línea que sube dentro de cada caso: el resultado medido
			ctx.save(); ctx.globalAlpha = done * 0.8; ctx.strokeStyle = `rgba(155,255,102,0.8)`; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x + 12, y + fh - 14); ctx.lineTo(x + fw * 0.3, y + fh - 20); ctx.lineTo(x + fw * 0.5, y + fh - 18); ctx.lineTo(x + fw * 0.72, y + fh - 30); ctx.stroke(); ctx.restore();
		});
	},

	// Sobre mí: la constelación del logotipo que se dibuja y una línea del tiempo que avanza.
	about(t) {
		const w = FORMAT === 'wide';
		const base = w ? [W * 0.13, H * 0.28] : [W * 0.5, H * 0.06];
		const k = w ? U * 0.22 : W * 0.3;
		const stars = [[0.0, 0.0], [0.28, 0.42], [0.58, 0.5], [0.42, 0.95], [0.9, 0.82], [0.72, 0.18]].map(([x, y]) => [base[0] + (x - (w ? 0 : 0.45)) * k, base[1] + y * k * (w ? 1 : 0.32)]);
		const links = [[0, 1], [1, 2], [2, 3], [2, 4], [2, 5]];
		const out = 1 - smooth(seg(t, 0.9, 0.98));
		links.forEach(([a, b], i) => {
			const p = smooth(seg(t, 0.06 + i * 0.08, 0.14 + i * 0.08)) * out;
			if (p <= 0) return;
			const [x1, y1] = stars[a], [x2, y2] = stars[b];
			line(x1, y1, lerp(x1, x2, p), lerp(y1, y2, p), 0.45, 1.4);
		});
		stars.forEach(([x, y], i) => node(x, y, i === 2 ? 3.6 : 2.6, 0.5 + 0.45 * smooth(seg(t, 0.04 + i * 0.07, 0.1 + i * 0.07))));
		// línea del tiempo: cuatro etapas que se encienden
		const tw = w ? W * 0.2 : W * 0.8, tx = w ? W * 0.76 : W * 0.1, ty = w ? H * 0.3 : H * 0.94;
		if (w) {
			line(tx + tw / 2, ty, tx + tw / 2, ty + H * 0.44, 0.18);
			for (let i = 0; i < 4; i++) { const y = ty + (i / 3) * H * 0.44, on = smooth(seg(t, 0.2 + i * 0.15, 0.26 + i * 0.15)) * out; node(tx + tw / 2, y, 3, 0.4 + on * 0.55); ring(tx + tw / 2, y, 12, 0.14 + on * 0.36, 1.2); glass(tx + tw / 2 + 22, y - 12, tw * 0.5, 24, 12, 0.6 + on * 0.4, 0.24, on * 0.3); ctx.save(); ctx.globalAlpha = 0.4 + on * 0.5; ctx.fillStyle = `rgba(${IVORY},0.45)`; rr(tx + tw / 2 + 34, y - 3, tw * 0.3, 6, 3); ctx.fill(); ctx.restore(); }
			packet(arcPath(tx + tw / 2, ty, tx + tw / 2, ty + H * 0.44, 0), seg(t, 0.18, 0.7), env(t, 0.18, 0.22, 0.66, 0.7));
		} else {
			line(tx, ty, tx + tw, ty, 0.18);
			for (let i = 0; i < 4; i++) { const x = tx + (i / 3) * tw, on = smooth(seg(t, 0.2 + i * 0.15, 0.26 + i * 0.15)) * out; node(x, ty, 3, 0.4 + on * 0.55); ring(x, ty, 11, 0.14 + on * 0.36, 1.2); }
			packet(arcPath(tx, ty, tx + tw, ty, 0), seg(t, 0.18, 0.7), env(t, 0.18, 0.22, 0.66, 0.7));
		}
	},

	// MADRE: primero cuatro terminales se pasan el contexto a mano (ámbar); luego el latido de MADRE
	// las une y todas leen la misma conversación (verde fósforo).
	madre(t) {
		const w = FORMAT === 'wide';
		const PH = '155,255,102', AMBER = '255,190,90';
		const C = w ? [[0.12, 0.3], [0.1, 0.66], [0.88, 0.3], [0.9, 0.66]] : [[0.14, 0.055], [0.86, 0.055], [0.14, 0.93], [0.86, 0.93]];
		const s = w ? U * 0.075 : W * 0.085;
		const [hx, hy] = w ? [W * 0.5, H * 0.88] : [W * 0.5, H * 0.955];
		const joined = smooth(seg(t, 0.36, 0.46)) * (1 - smooth(seg(t, 0.92, 0.99)));
		// el latido de MADRE abajo al centro
		const pw = w ? U * 0.36 : W * 0.42, ph = pw / 3, px = hx - pw / 2, py = hy - ph / 2;
		const pts = [[1, 8], [11, 8], [14, 2], [19, 14], [23, 5], [25, 8], [37, 8]].map(([x, y]) => [px + (x / 48) * pw, py + (y / 16) * ph]);
		const draw = seg(t, 0.36, 0.5);
		ctx.save(); ctx.strokeStyle = `rgba(${PH},${0.25 + 0.6 * joined})`; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
		const total = pts.length - 1, upto = draw * total;
		for (let i = 0; i <= Math.floor(upto) && i < pts.length; i++) (i ? ctx.lineTo(...pts[i]) : ctx.moveTo(...pts[i]));
		if (upto < total) { const i = Math.floor(upto), k = upto - i; ctx.lineTo(lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)); }
		ctx.stroke(); ctx.restore();
		const beat = joined * (0.6 + 0.4 * Math.max(0, Math.sin(t * TAU * 6)));
		ctx.save(); ctx.globalAlpha = Math.max(0.15, beat); ctx.fillStyle = `rgb(${PH})`; ctx.beginPath(); ctx.arc(px + (43.5 / 48) * pw, py + ph / 2, (w ? 7 : 6), 0, TAU); ctx.fill(); ctx.restore();
		const hub = [px + (43.5 / 48) * pw, py + ph / 2];
		// terminales: una barra, el indicador y un par de líneas
		C.forEach(([cx, cy], i) => {
			const x = cx * W, y = cy * H + Math.sin(t * TAU + i * 1.3) * (w ? 5 : 3);
			glass(x - s * 1.25, y - s * 0.85, s * 2.5, s * 1.7, 14, 1, 0.3, joined * 0.25);
			ctx.save(); ctx.globalAlpha = 0.8; ctx.strokeStyle = `rgba(${joined > 0.5 ? PH : IVORY},0.9)`; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
			ctx.beginPath(); ctx.moveTo(x - s * 0.95, y - s * 0.3); ctx.lineTo(x - s * 0.7, y - s * 0.1); ctx.lineTo(x - s * 0.95, y + s * 0.1); ctx.stroke(); ctx.restore();
			ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = `rgba(${IVORY},0.4)`; rr(x - s * 0.55, y - s * 0.16, s * (1.2 - (i % 2) * 0.3), 6, 3); ctx.fill(); rr(x - s * 0.95, y + s * 0.3, s * (1.6 - (i % 3) * 0.3), 6, 3); ctx.fill(); ctx.restore();
			// unidas a MADRE: una línea fija y paquetes de ida y vuelta
			if (joined > 0.01) {
				const link = arcPath(x, y + (cy < 0.5 ? s * 0.85 : -s * 0.85) * (w ? 0 : 1) + (w ? s * 0.85 : 0), hub[0], hub[1], (cx < 0.5 ? 1 : -1) * (w ? U * 0.1 : W * 0.08));
				ctx.save(); ctx.globalAlpha = joined; strokePath(link, 0.0, 1); ctx.strokeStyle = `rgba(${PH},0.32)`; ctx.setLineDash([3, 7]); ctx.lineWidth = 1.2; ctx.beginPath(); link.pts.forEach((q, k) => (k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]))); ctx.stroke(); ctx.restore();
				const f = ((t - 0.46) * 3 + i * 0.25) % 1;
				if (t > 0.46) { ctx.save(); ctx.globalAlpha = joined; const q = at(link, i % 2 ? f : 1 - f); ctx.fillStyle = `rgba(${PH},0.95)`; ctx.beginPath(); ctx.arc(q.x, q.y, 3.4, 0, TAU); ctx.fill(); ctx.restore(); }
			}
		});
		// antes de MADRE: el contexto viaja a mano, de una terminal a otra, en ámbar
		const hops = [[1, 0, 0.04], [0, 2, 0.13], [2, 3, 0.22]];
		hops.forEach(([a, b, s0]) => {
			const k = seg(t, s0, s0 + 0.08); if (k <= 0 || k >= 1) return;
			const [ax, ay] = [C[a][0] * W, C[a][1] * H], [bx, by] = [C[b][0] * W, C[b][1] * H];
			const path = arcPath(ax, ay, bx, by, (w ? -U * 0.18 : W * 0.25));
			const q = at(path, ease(k));
			ctx.save(); ctx.globalAlpha = Math.min(1, k * 6, (1 - k) * 6); glass(q.x - 26, q.y - 16, 52, 32, 8, 1, 0.4, 0.2);
			ctx.strokeStyle = `rgba(${AMBER},0.95)`; ctx.lineWidth = 1.6; rr(q.x - 9, q.y - 10, 18, 20, 3); ctx.stroke(); ctx.restore();
		});
	},
};

const scene = SCENES[SCENE];
if (!scene) throw new Error(`Escena desconocida: ${SCENE}`);
window.DURATION = 10;
window.renderAt = (seconds) => {
	const t = (((seconds / window.DURATION) % 1) + 1) % 1;
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	background(t, SCENE === 'bloqio' ? { x: 0.7, y: 0.4, r: 0.5, rgb: '90,70,160', a: 0.12 } : SCENE === 'miawseo' ? { x: 0.5, y: 0.5, r: 0.7, rgb: '140,90,110', a: 0.08 } : SCENE === 'consultoria' ? { x: 0.3, y: 0.6, r: 0.5, rgb: '60,100,120', a: 0.1 } : SCENE === 'home' ? { x: 0.8, y: 0.4, r: 0.5, rgb: '70,120,90', a: 0.12 } : SCENE === 'audit' ? { x: 0.75, y: 0.4, r: 0.5, rgb: '120,90,70', a: 0.1 } : SCENE === 'madre' ? { x: 0.5, y: 0.8, r: 0.6, rgb: '40,120,50', a: 0.2 } : null);
	scene(t);
	finish();
};
window.renderAt(0);
</script>
