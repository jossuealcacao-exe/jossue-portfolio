<!doctype html>
<meta charset="utf-8" />
<title>Hero loops</title>
<style>
	html, body { margin: 0; background: #050608; }
	canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script>
// Bucles abstractos de 10 s para el héroe de cada ficha de producto. Dibujo determinista:
// renderAt(t) con t en [0, 1) pinta el cuadro entero, sin estado oculto, para que
// render-hero-loops.mjs lo grabe cuadro por cuadro. Todo lo que se mueve es periódico, así
// que el último cuadro engancha con el primero. Nada de texto salvo la marca `.ahp/`.
const TAU = Math.PI * 2;
const params = new URLSearchParams(location.search);
const SCENE = params.get('scene') || 'daniela';
const FORMAT = params.get('fmt') === 'tall' ? 'tall' : 'wide';
const SIZE = FORMAT === 'tall' ? [720, 1280] : [1600, 900];
const [W, H] = SIZE;
const canvas = document.getElementById('c');
canvas.width = W;
canvas.height = H;
const ctx = canvas.getContext('2d');
const U = Math.min(W, H); // unidad de tamaño: el lado corto

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const smooth = (x) => x * x * (3 - 2 * x);
// sube entre a y b, se mantiene, baja entre c y d
const env = (t, a, b, c, d) => smooth(seg(t, a, b)) * (1 - smooth(seg(t, c, d)));
const lerp = (a, b, k) => a + (b - a) * k;
function rng(seed) { let s = seed >>> 0; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }

const IVORY = '236,230,216';
const STAR = '223,230,255';

// ---------- fondo: nebulosa, estrellas y grano, igual que el logotipo ----------
const rand = rng(7);
const stars = Array.from({ length: FORMAT === 'tall' ? 150 : 240 }, () => ({
	x: rand() * W, y: rand() * H, r: 0.35 + Math.pow(rand(), 3) * 1.5,
	base: 0.25 + rand() * 0.6, ph: rand() * TAU, f: 1 + Math.floor(rand() * 3), dx: (rand() - 0.5) * 10, dy: (rand() - 0.5) * 8,
}));
const grain = (() => {
	const g = document.createElement('canvas'); g.width = 256; g.height = 256;
	const gc = g.getContext('2d'); const img = gc.createImageData(256, 256); const r = rng(99);
	for (let i = 0; i < img.data.length; i += 4) { const v = 118 + r() * 30; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 13; }
	gc.putImageData(img, 0, 0); return gc.createPattern(g, 'repeat');
})();

function blob(x, y, r, rgb, a) {
	const g = ctx.createRadialGradient(x, y, 0, x, y, r);
	g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
	ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function background(t, tint) {
	const a = t * TAU;
	ctx.fillStyle = '#04050a'; ctx.fillRect(0, 0, W, H);
	const R = Math.max(W, H);
	blob(W * (0.26 + 0.03 * Math.sin(a)), H * (0.30 + 0.025 * Math.cos(a)), R * 0.62, '30,38,92', 0.62);
	blob(W * (0.76 + 0.025 * Math.cos(a)), H * (0.72 + 0.03 * Math.sin(a)), R * 0.55, '58,32,86', 0.46);
	blob(W * 0.5, H * (0.5 + 0.02 * Math.sin(a + 1)), R * 0.42, '70,92,150', 0.16);
	if (tint) blob(W * tint.x, H * tint.y, R * tint.r, tint.rgb, tint.a * (0.8 + 0.2 * Math.sin(a * 2)));
	for (const s of stars) {
		const k = 0.55 + 0.45 * Math.sin(a * s.f + s.ph);
		const x = s.x + s.dx * Math.sin(a + s.ph), y = s.y + s.dy * Math.cos(a + s.ph);
		ctx.globalAlpha = s.base * k;
		ctx.fillStyle = `rgb(${STAR})`;
		ctx.beginPath(); ctx.arc(x, y, s.r, 0, TAU); ctx.fill();
		if (s.r > 1.2) { ctx.globalAlpha *= 0.25; ctx.beginPath(); ctx.arc(x, y, s.r * 3.2, 0, TAU); ctx.fill(); }
	}
	ctx.globalAlpha = 1;
}
function finish() {
	// grano estático, viñeta y una zona calma en el centro para que el titular se lea
	ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H);
	const v = ctx.createRadialGradient(W / 2, H / 2, U * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
	v.addColorStop(0, 'rgba(2,3,6,0)'); v.addColorStop(1, 'rgba(2,3,6,0.7)');
	ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
	const c = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, FORMAT === 'tall' ? W * 0.62 : W * 0.36);
	c.addColorStop(0, 'rgba(4,5,9,0.5)'); c.addColorStop(1, 'rgba(4,5,9,0)');
	ctx.fillStyle = c; ctx.fillRect(0, 0, W, H);
}

// ---------- primitivas ----------
function rr(x, y, w, h, r) {
	r = Math.min(r, w / 2, h / 2);
	ctx.beginPath();
	ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
	ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glass(x, y, w, h, r, a = 1, edge = 0.22, hi = 0) {
	if (a <= 0.003) return;
	ctx.save(); ctx.globalAlpha = a;
	rr(x, y, w, h, r);
	const g = ctx.createLinearGradient(x, y, x, y + h);
	g.addColorStop(0, `rgba(196,206,246,${0.15 + hi * 0.14})`); g.addColorStop(1, `rgba(120,132,196,${0.06 + hi * 0.08})`);
	ctx.fillStyle = g; ctx.fill();
	ctx.lineWidth = 1.2; ctx.strokeStyle = `rgba(${IVORY},${edge + hi * 0.28})`; ctx.stroke();
	ctx.restore();
}
function node(x, y, r, a = 1) {
	if (a <= 0.003) return;
	ctx.save(); ctx.globalAlpha = a;
	const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3.4);
	g.addColorStop(0, 'rgba(255,248,232,0.9)'); g.addColorStop(0.35, `rgba(${IVORY},0.45)`); g.addColorStop(1, `rgba(${IVORY},0)`);
	ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.4, 0, TAU); ctx.fill();
	ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
	ctx.restore();
}
function line(x1, y1, x2, y2, a = 0.3, w = 1) {
	if (a <= 0.003) return;
	ctx.strokeStyle = `rgba(${IVORY},${a})`; ctx.lineWidth = w; ctx.lineCap = 'round';
	ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ring(x, y, r, a, w = 1.4) {
	if (a <= 0.003) return;
	ctx.strokeStyle = `rgba(${IVORY},${a})`; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
}
function check(x, y, s, a, w = 2) {
	if (a <= 0.003) return;
	ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
	ctx.beginPath(); ctx.moveTo(x - s * 0.5, y); ctx.lineTo(x - s * 0.1, y + s * 0.4); ctx.lineTo(x + s * 0.55, y - s * 0.4); ctx.stroke(); ctx.restore();
}
// camino por puntos (con esquinas redondeadas) para trenes y paquetes
function smoothPath(pts, radius) {
	const out = [pts[0]];
	for (let i = 1; i < pts.length - 1; i++) {
		const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
		const d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]), d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
		const r = Math.min(radius, d1 / 2, d2 / 2);
		const a = [p1[0] + ((p0[0] - p1[0]) / d1) * r, p1[1] + ((p0[1] - p1[1]) / d1) * r];
		const b = [p1[0] + ((p2[0] - p1[0]) / d2) * r, p1[1] + ((p2[1] - p1[1]) / d2) * r];
		for (let k = 0; k <= 8; k++) { const s = k / 8; out.push([(1 - s) * (1 - s) * a[0] + 2 * (1 - s) * s * p1[0] + s * s * b[0], (1 - s) * (1 - s) * a[1] + 2 * (1 - s) * s * p1[1] + s * s * b[1]]); }
	}
	out.push(pts[pts.length - 1]);
	let len = 0; const cum = [0];
	for (let i = 1; i < out.length; i++) { len += Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]); cum.push(len); }
	return { pts: out, cum, len };
}
function at(path, p) {
	const d = clamp(p) * path.len; let i = 1;
	while (i < path.cum.length - 1 && path.cum[i] < d) i++;
	const k = (d - path.cum[i - 1]) / Math.max(1e-6, path.cum[i] - path.cum[i - 1]);
	const a = path.pts[i - 1], b = path.pts[i];
	return { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}
function strokePath(path, a, w = 1, dash) {
	ctx.save(); ctx.strokeStyle = `rgba(${IVORY},${a})`; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
	if (dash) ctx.setLineDash(dash);
	ctx.beginPath(); path.pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); ctx.restore();
}
// curva suave entre dos puntos (para los paquetes que viajan)
function arcPath(x1, y1, x2, y2, bend) {
	const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, n = Math.hypot(dx, dy) || 1;
	const cx = mx - (dy / n) * bend, cy = my + (dx / n) * bend;
	const pts = []; for (let k = 0; k <= 36; k++) { const s = k / 36; pts.push([(1 - s) * (1 - s) * x1 + 2 * (1 - s) * s * cx + s * s * x2, (1 - s) * (1 - s) * y1 + 2 * (1 - s) * s * cy + s * s * y2]); }
	let len = 0; const cum = [0]; for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(len); }
	return { pts, cum, len };
}
// paquete con cola
function packet(path, p, a = 1, r = 3.2) {
	if (p <= 0 || p >= 1 || a <= 0.003) return;
	for (let k = 7; k >= 1; k--) { const q = at(path, p - k * 0.012); if (p - k * 0.012 < 0) continue; node(q.x, q.y, r * (1 - k * 0.1), a * (1 - k / 8) * 0.55); }
	const q = at(path, p); node(q.x, q.y, r, a);
}
function bottle(x, y, w, h, a, hi) {
	glass(x, y + h * 0.16, w, h * 0.84, w * 0.28, a, 0.22, hi);
	glass(x + w * 0.2, y, w * 0.6, h * 0.2, w * 0.12, a, 0.26, hi);
	ctx.save(); ctx.globalAlpha = a * 0.5; ctx.fillStyle = `rgba(${IVORY},0.18)`; rr(x + w * 0.2, y + h * 0.5, w * 0.6, h * 0.05, 2); ctx.fill(); rr(x + w * 0.28, y + h * 0.6, w * 0.44, h * 0.04, 2); ctx.fill(); ctx.restore();
}
function bubble(x, y, w, h, tail, a, fill = 0, hi = 0) {
	if (a <= 0.003) return;
	glass(x, y, w, h, h * 0.42, a, 0.2, hi);
	ctx.save(); ctx.globalAlpha = a * 0.7; ctx.strokeStyle = `rgba(${IVORY},0.2)`; ctx.lineWidth = 1.2;
	ctx.beginPath(); if (tail === 'left') { ctx.moveTo(x + h * 0.25, y + h); ctx.lineTo(x + h * 0.05, y + h * 1.3); ctx.lineTo(x + h * 0.55, y + h); } else { ctx.moveTo(x + w - h * 0.25, y + h); ctx.lineTo(x + w - h * 0.05, y + h * 1.3); ctx.lineTo(x + w - h * 0.55, y + h); } ctx.stroke(); ctx.restore();
	if (fill > 0) { ctx.save(); ctx.globalAlpha = a * fill * 0.55; ctx.fillStyle = `rgba(${IVORY},0.35)`; rr(x + h * 0.4, y + h * 0.3, w * 0.62 * fill, h * 0.12, 3); ctx.fill(); if (h > U * 0.07) { rr(x + h * 0.4, y + h * 0.55, w * 0.42 * fill, h * 0.12, 3); ctx.fill(); } ctx.restore(); }
}
function dots(x, y, t, a) {
	for (let i = 0; i < 3; i++) { const k = 0.35 + 0.65 * Math.max(0, Math.sin(t * TAU * 8 - i * 0.9)); ctx.save(); ctx.globalAlpha = a * k; ctx.fillStyle = `rgba(${IVORY},0.9)`; ctx.beginPath(); ctx.arc(x + i * 13, y, 3.4, 0, TAU); ctx.fill(); ctx.restore(); }
}
const P = (x, y) => [x * W, y * H];

// ---------- escenas ----------
const SCENES = {
	// Una conversación que llega al catálogo, el servidor lo revisa y termina en el carrito.
	daniela(t) {
		const w = FORMAT === 'wide';
		const L = w
			? { b1: [0.07, 0.30], b2: [0.06, 0.46], b3: [0.09, 0.64], srv: [0.46, 0.13], cat: [0.62, 0.20], c1: [0.74, 0.26], c2: [0.82, 0.38], c3: [0.90, 0.28], cart: [0.84, 0.76] }
			: { b1: [0.12, 0.12], b2: [0.08, 0.22], b3: [0.14, 0.33], srv: [0.50, 0.46], cat: [0.50, 0.58], c1: [0.20, 0.70], c2: [0.50, 0.74], c3: [0.78, 0.70], cart: [0.50, 0.90] };
		const bw = w ? U * 0.34 : W * 0.5, bh = w ? U * 0.075 : H * 0.045;
		const [b1x, b1y] = P(...L.b1), [b2x, b2y] = P(...L.b2), [b3x, b3y] = P(...L.b3);
		const [sx, sy] = P(...L.srv), [kx, ky] = P(...L.cat);
		const cs = [L.c1, L.c2, L.c3].map((q) => P(...q));
		const [cx, cy] = P(...L.cart);
		// constelación de fondo
		const base = [[b1x + bw, b1y + bh / 2], [sx, sy], [kx, ky], ...cs, [cx, cy]];
		line(base[0][0], base[0][1], sx, sy, 0.2); line(sx, sy, kx, ky, 0.26);
		cs.forEach(([x, y]) => line(kx, ky, x, y + U * 0.04, 0.2)); line(cs[1][0] + U * 0.03, cs[1][1] + U * 0.15, cx, cy, 0.18);
		// burbujas
		const e1 = env(t, 0.03, 0.1, 0.9, 0.97), e2 = env(t, 0.12, 0.2, 0.9, 0.97), e3 = env(t, 0.5, 0.57, 0.9, 0.97);
		bubble(b1x, b1y, bw * 0.78, bh, 'right', e1, smooth(seg(t, 0.06, 0.13)));
		const typing = seg(t, 0.14, 0.26) < 1 && t > 0.14;
		bubble(b2x, b2y, bw, bh * 1.55, 'left', e2, smooth(seg(t, 0.26, 0.36)), 0.1);
		if (typing) dots(b2x + bh * 0.8, b2y + bh * 0.78, t, e2);
		bubble(b3x, b3y, bw * 0.55, bh, 'right', e3, smooth(seg(t, 0.52, 0.58)));
		node(b1x + bw * 0.78 + 14, b1y + bh / 2, 2.2, e1 * 0.8);
		// servidor: guardia con un anillo que late cuando valida
		node(sx, sy, 4, 0.9);
		const v1 = env(t, 0.2, 0.26, 0.34, 0.4), v2 = env(t, 0.72, 0.78, 0.84, 0.9);
		const pr = (v) => ring(sx, sy, 16 + 22 * (1 - v), v * 0.6);
		pr(v1); pr(v2); check(sx, sy - 0.5, 8, Math.max(v1, v2) * 0.9, 1.8);
		ring(sx, sy, 12, 0.22 + 0.1 * Math.sin(t * TAU * 2));
		node(kx, ky, 3.2, 0.8);
		// paquetes
		packet(arcPath(b1x + bw * 0.78, b1y + bh / 2, sx, sy, -U * 0.08), seg(t, 0.1, 0.2), env(t, 0.1, 0.12, 0.18, 0.2));
		packet(arcPath(sx, sy, kx, ky, U * 0.02), seg(t, 0.36, 0.44), 1);
		// tarjetas de producto: una se elige
		const pick = env(t, 0.46, 0.54, 0.66, 0.74);
		cs.forEach(([x, y], i) => {
			const a = env(t, 0.38 + i * 0.03, 0.46 + i * 0.03, 0.9, 0.97);
			const hi = i === 1 ? pick : 0;
			const s = 1 + hi * 0.12;
			ctx.save(); ctx.translate(x + U * 0.03, y + U * 0.07); ctx.scale(s, s); ctx.translate(-(x + U * 0.03), -(y + U * 0.07));
			bottle(x, y, U * 0.062, U * 0.14, a, hi); ctx.restore();
			ctx.save(); ctx.globalAlpha = a * 0.5; ctx.fillStyle = `rgba(${IVORY},0.3)`; rr(x - U * 0.005, y + U * 0.16, U * 0.07, U * 0.014, 3); ctx.fill(); ctx.restore();
		});
		packet(arcPath(cs[1][0] + U * 0.03, cs[1][1] + U * 0.15, cx, cy - U * 0.05, U * 0.06), seg(t, 0.58, 0.72), 1);
		packet(arcPath(sx, sy, cs[1][0] + U * 0.03, cs[1][1], -U * 0.05), seg(t, 0.44, 0.52), env(t, 0.44, 0.46, 0.5, 0.52));
		// carrito
		const ca = env(t, 0.5, 0.6, 0.9, 0.97), pop = 1 + 0.18 * env(t, 0.72, 0.75, 0.78, 0.84);
		ctx.save(); ctx.globalAlpha = ca; ctx.translate(cx, cy); ctx.scale(pop, pop);
		ctx.strokeStyle = `rgba(${IVORY},0.5)`; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
		ctx.beginPath(); ctx.moveTo(-U * 0.05, -U * 0.02); ctx.lineTo(U * 0.05, -U * 0.02); ctx.lineTo(U * 0.038, U * 0.05); ctx.lineTo(-U * 0.038, U * 0.05); ctx.closePath(); ctx.stroke();
		ctx.beginPath(); ctx.moveTo(-U * 0.03, -U * 0.02); ctx.lineTo(-U * 0.012, -U * 0.055); ctx.moveTo(U * 0.03, -U * 0.02); ctx.lineTo(U * 0.012, -U * 0.055); ctx.stroke();
		ctx.restore();
		check(cx, cy + U * 0.012, 9, env(t, 0.74, 0.78, 0.86, 0.92) * 0.9, 2);
	},

	// El relevo de AHP+: cuatro agentes, una carpeta compartida y un historial que avanza.
	ahp(t) {
		const w = FORMAT === 'wide';
		const L = w
			? { a: [[0.10, 0.24], [0.90, 0.24], [0.90, 0.64], [0.10, 0.64]], led: [0.5, 0.80], git: 0.935 }
			: { a: [[0.18, 0.12], [0.82, 0.12], [0.82, 0.88], [0.18, 0.88]], led: [0.5, 0.80], git: 0.965 };
		const A = L.a.map((q) => P(...q));
		const [lx, ly] = P(...L.led);
		const lw = w ? U * 0.5 : W * 0.5, lh = w ? U * 0.15 : H * 0.075;
		const gy = L.git * H;
		// historial: línea con confirmaciones (commits) que se encienden en cada relevo
		line(W * 0.04, gy, W * 0.96, gy, 0.12);
		const nc = 12;
		for (let i = 0; i < nc; i++) { const x = lerp(W * 0.06, W * 0.94, i / (nc - 1)); const lit = clamp(0.25 + 0.75 * seg(t * nc * 1.0, i - 0.2, i + 0.6)); node(x, gy, 2.1, 0.35 + lit * 0.55 * (i / nc < t + 0.04 ? 1 : 0.45)); }
		// carpeta .ahp/
		const pulse = 0.5 + 0.5 * Math.sin(t * TAU * 4);
		glass(lx - lw / 2, ly - lh / 2, lw, lh, 14, 1, 0.22, 0.25 * pulse);
		ctx.save(); ctx.fillStyle = `rgba(${IVORY},0.82)`; ctx.font = `600 ${Math.round(lh * 0.34)}px ui-monospace, 'SF Mono', Menlo, monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
		ctx.fillText('.ahp/', lx, ly - lh * 0.12);
		ctx.globalAlpha = 0.35; ctx.fillRect(lx - lw * 0.32, ly + lh * 0.24, lw * 0.64, 2); ctx.globalAlpha = 0.22; ctx.fillRect(lx - lw * 0.32, ly + lh * 0.34, lw * 0.4, 2); ctx.restore();
		// agentes: una forma distinta cada uno
		const shape = (i, x, y, s, a, hi) => {
			glass(x - s, y - s, s * 2, s * 2, s * 0.5, a, 0.24, hi);
			ctx.save(); ctx.globalAlpha = a * (0.55 + hi * 0.45); ctx.strokeStyle = `rgba(${IVORY},0.9)`; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.beginPath();
			if (i === 0) ctx.arc(x, y, s * 0.42, 0, TAU);
			if (i === 1) { ctx.rect(x - s * 0.36, y - s * 0.36, s * 0.72, s * 0.72); }
			if (i === 2) { ctx.moveTo(x, y - s * 0.44); ctx.lineTo(x + s * 0.44, y + s * 0.36); ctx.lineTo(x - s * 0.44, y + s * 0.36); ctx.closePath(); }

	// Bloqio Builder: bloques que se acomodan en una página, se revisan uno por uno y se ven en el teléfono.

	// Miawseo: una red de metro con trenes y estaciones que se abren como salas.
	miawseo(t) {
		const w = FORMAT === 'wide';
		const lines = w
			? [
				{ c: '236,230,216', pts: [[0.02, 0.22], [0.30, 0.22], [0.38, 0.12], [0.70, 0.12], [0.78, 0.22], [0.98, 0.22]] },
				{ c: '168,184,255', pts: [[0.02, 0.80], [0.22, 0.80], [0.30, 0.90], [0.66, 0.90], [0.74, 0.80], [0.98, 0.80]] },

		rooms.forEach(([x, y, at0], i) => {

	// Consultoría: una tienda que se revisa de arriba abajo, el embudo con su fuga y el plan por prioridad.
	consultoria(t) {

			ring(px + 8, yy + 4, 7, a * 0.5, 1.3); check(px + 8, yy + 4.4, 6, a * smooth(seg(t, 0.64 + i * 0.08, 0.7 + i * 0.08)), 1.6);

	// Desarrollo web: la tienda se arma en escritorio y teléfono, y un paquete recorre alcance → diseño → construcción → entrega.
	web(t) {
		const w = FORMAT === 'wide';
		const dx = w ? W * 0.06 : W * 0.1, dy = w ? H * 0.14 : H * 0.04, dw = w ? W * 0.33 : W * 0.8, dh = w ? H * 0.58 : H * 0.28;
		glass(dx, dy, dw, dh, 14, 1, 0.2, 0);

			const a = env(t, ph0 - 0.15, ph0 - 0.05, ph0 + 0.1, ph0 + 0.2) * (w ? 1 : 0.8), gx = (w ? x : 0.12 + i * 0.3) * W, gy = (w ? y : 0.72 + i * 0.03) * H;

		// tubería de entrega: cuatro nodos y un paquete
		const ny = w ? H * 0.87 : H * 0.84, nx0 = w ? W * 0.1 : W * 0.14, nx1 = w ? W * 0.9 : W * 0.86;
		line(nx0, ny, nx1, ny, 0.16);
		for (let i = 0; i < 4; i++) {
			const x = lerp(nx0, nx1, i / 3), on = smooth(seg(t, 0.2 + i * 0.2, 0.26 + i * 0.2));
			node(x, ny, 3, 0.45 + 0.5 * on); ring(x, ny, 13, 0.16 + 0.34 * on, 1.3); check(x, ny + 0.5, 6, on * (1 - smooth(seg(t, 0.94, 1))), 1.6);
		}
		const pipe = arcPath(nx0, ny, nx1, ny, 0);
		packet(pipe, seg(t, 0.04, 0.9), env(t, 0.04, 0.08, 0.86, 0.92), 3.4);
	},
};

const scene = SCENES[SCENE];
if (!scene) throw new Error(`Escena desconocida: ${SCENE}`);
window.DURATION = 10;
window.renderAt = (seconds) => {
	const t = (((seconds / window.DURATION) % 1) + 1) % 1;
	ctx.setTransform(1, 0, 0, 1, 0, 0);
	background(t, SCENE === 'bloqio' ? { x: 0.7, y: 0.4, r: 0.5, rgb: '90,70,160', a: 0.12 } : SCENE === 'miawseo' ? { x: 0.5, y: 0.5, r: 0.7, rgb: '140,90,110', a: 0.08 } : SCENE === 'consultoria' ? { x: 0.3, y: 0.6, r: 0.5, rgb: '60,100,120', a: 0.1 } : null);
	scene(t);
	finish();
};
window.renderAt(0);
</script>
